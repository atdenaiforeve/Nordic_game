<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLACKSITE-01 // NEW FACILITY MAP</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#555;color:#eee;font:12px Arial}#game{position:fixed;inset:0}.hud{position:fixed;left:12px;top:12px;z-index:5;background:#171918cc;border:1px solid #777;padding:10px;border-radius:4px;line-height:1.5}.hud b{letter-spacing:1px}.hint{color:#bbb;font-size:11px}</style></head><body><div id="game"></div><div class="hud"><b>BLACKSITE-01 // FACILITY MAP — TEST</b><br><span id="zone">SECURITY OFFICE</span><br><span class="hint">Drag to look • WASD / arrows to move</span></div><script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script><script>
const T=THREE,scene=new T.Scene();scene.background=new T.Color(0x737773);scene.fog=new T.Fog(0x737773,35,125);const cam=new T.PerspectiveCamera(68,innerWidth/innerHeight,.05,180);cam.position.set(0,1.65,4.6);cam.rotation.order='YXZ';const r=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.setSize(innerWidth,innerHeight);r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.05;document.getElementById('game').appendChild(r.domElement);
const M={floor:new T.MeshStandardMaterial({color:0x50524f,roughness:.86}),wall:new T.MeshStandardMaterial({color:0xb3b4ae,roughness:.9}),room:new T.MeshStandardMaterial({color:0x777a75,roughness:.92}),corr:new T.MeshStandardMaterial({color:0x666864,roughness:.9}),steel:new T.MeshStandardMaterial({color:0x6d716d,roughness:.32,metalness:.7}),dark:new T.MeshStandardMaterial({color:0x202322,roughness:.5,metalness:.4}),trim:new T.MeshStandardMaterial({color:0x303331,roughness:.6,metalness:.25}),screen:new T.MeshStandardMaterial({color:0x17201f,roughness:.3,emissive:0x07100f,emissiveIntensity:.5})};
const office=new T.Group();scene.add(office);function box(g,w,h,d,x,y,z,m){let q=new T.Mesh(new T.BoxGeometry(w,h,d),m);q.position.set(x,y,z);q.castShadow=true;q.receiveShadow=true;g.add(q);return q}function floor(g,w,d,x,z,m=M.floor){let q=box(g,w,.16,d,x,.08,z,m);q.castShadow=false;return q}function room(x,z,w,d){floor(map,w,d,x,z,M.floor);box(map,w,4.8,.22,x,2.4,z-d/2,M.room);box(map,w,4.8,.22,x,2.4,z+d/2,M.room);box(map,.22,4.8,d,x-w/2,2.4,z,M.room);box(map,.22,4.8,d,x+w/2,2.4,z,M.room)}function hall(x,z,w,d){floor(map,w,d,x,z,M.floor);box(map,w,4.8,.22,x,2.4,z-d/2,M.corr);box(map,w,4.8,.22,x,2.4,z+d/2,M.corr)}
/* The office is a sealed architectural shell. The only rear openings are the two doors. */floor(office,16,13,0,0);box(office,16,5.3,.22,0,2.65,6.5,M.wall);box(office,.22,5.3,13,-8,2.65,0,M.wall);box(office,.22,5.3,13,8,2.65,0,M.wall);box(office,5.6,5.3,.22,-5.2,2.65,-6.5,M.wall);box(office,5.6,5.3,.22,5.2,2.65,-6.5,M.wall);box(office,4,1.1,.22,0,4.75,-6.5,M.wall);box(office,16,.18,13,0,5.28,0,M.wall);
function door(x){let g=new T.Group();g.position.set(x,0,-6.38);office.add(g);box(g,3.2,5.05,.25,0,2.52,0,M.dark);box(g,2.8,4.65,.08,0,2.42,.16,M.steel);box(g,.08,.5,.08,.65,2.5,.24,M.dark)}door(-4.7);door(4.7);for(let x of[-1.8,1.8]){box(office,1.5,2.25,.08,x,3,-6.38,M.screen);box(office,1.65,.08,.1,x,4.15,-6.35,M.trim);box(office,1.65,.08,.1,x,1.85,-6.35,M.trim)}
/* workstation */box(office,8.4,.82,2.05,0,.95,2.35,M.dark);for(let x of[-2.75,-.92,.92,2.75]){box(office,1.55,1,.1,x,2.12,1.65,M.dark);box(office,1.4,.83,.035,x,2.12,1.59,M.screen);box(office,.1,.5,.08,x,1.58,1.72,M.steel)}box(office,1.4,2.2,.7,-6.5,1.2,3.8,M.steel);box(office,1.4,2.2,.7,6.5,1.2,3.8,M.steel);
/* Facility map, aligned directly with the two office exits. */const map=new T.Group();map.name='NEW_FACILITY_MAP';scene.add(map);hall(-4.7,-11.5,3.8,10);hall(4.7,-11.5,3.8,10);hall(0,-16.5,13.2,3.8);hall(10,-20,5,10);hall(20,-10,5,20);hall(20,10,5,20);hall(10,20,20,5);hall(0,20,5,5);hall(-10,20,20,5);hall(-20,10,5,20);hall(-20,-10,5,20);hall(-10,-20,20,5);
room(20,0,14,10);room(20,22,14,10);room(0,22,12,10);room(-20,22,14,10);room(-20,0,14,10);room(-20,-22,14,10);room(0,-22,14,10);room(20,-22,14,10);
/* Hall A is intentionally a visible two-branch junction immediately outside security. */hall(-2.4,-8.5,4.6,6);hall(2.4,-8.5,4.6,6);box(map,0.35,4.6,6,-.18,2.3,-8.5,M.corr);
/* doors from branch halls into the main spine */for(let x of[-4.7,4.7])box(map,3.2,4.9,.18,x,2.45,-6.25,M.dark);
function label(text,x,z){let c=document.createElement('canvas');c.width=512;c.height=128;let ctx=c.getContext('2d');ctx.fillStyle='#e5e5df';ctx.font='bold 42px Arial';ctx.textAlign='center';ctx.fillText(text,256,70);let s=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),transparent:true,depthWrite:false}));s.position.set(x,4.7,z);s.scale.set(7,1.75,1);map.add(s)}label('HALL A',0,-10);label('STORAGE',20,0);label('SERVER',20,22);label('LAB',0,22);label('ARCHIVE',-20,22);label('MAINTENANCE',-20,0);label('GENERATOR',-20,-22);label('LOADING',20,-22);label('RESEARCH',0,-22);
/* lights */scene.add(new T.HemisphereLight(0xe6e6df,0x3e403d,1.7));let sun=new T.DirectionalLight(0xe6e6dc,2.1);sun.position.set(-18,25,12);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-55;sun.shadow.camera.right=55;sun.shadow.camera.top=55;sun.shadow.camera.bottom=-55;scene.add(sun);for(let p of[[0,4,-10],[20,4,0],[20,4,22],[-20,4,22],[-20,4,0],[-20,4,-22],[20,4,-22]]){let l=new T.PointLight(0xe0e1dc,5,18,2);l.position.set(...p);scene.add(l)}
let keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);let dragging=false,lastX=0,lastY=0;addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY});addEventListener('pointerup',()=>dragging=false);addEventListener('pointermove',e=>{if(!dragging)return;cam.rotation.y-=(e.clientX-lastX)*.004;cam.rotation.x-=(e.clientY-lastY)*.002;cam.rotation.x=Math.max(-1.15,Math.min(1.15,cam.rotation.x));lastX=e.clientX;lastY=e.clientY});function move(){let s=.075,dx=0,dz=0;if(keys.w||keys.arrowup)dz-=s;if(keys.s||keys.arrowdown)dz+=s;if(keys.a||keys.arrowleft)dx-=s;if(keys.d||keys.arrowright)dx+=s;let sy=Math.sin(cam.rotation.y),cy=Math.cos(cam.rotation.y);cam.position.x+=dx*cy+dz*sy;cam.position.z+=dz*cy-dx*sy;cam.position.x=Math.max(-27,Math.min(27,cam.position.x));cam.position.z=Math.max(-29,Math.min(29,cam.position.z));}
function loop(){requestAnimationFrame(loop);move();r.render(scene,cam)}loop();addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
</script></body></html>
