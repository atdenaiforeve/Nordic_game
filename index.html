<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NORDIC // BLACKSITE-01</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#06080b;color:#b6c2cf;font-family:monospace}button{font:inherit;color:inherit;background:#11151b;border:1px solid #38d9ff;padding:12px 18px;cursor:pointer}button:hover{background:#1a5f7a}button:disabled{opacity:.35;cursor:not-allowed}.hidden{display:none!important}
#mainMenu,#nightSelect,#training{position:fixed;inset:0;z-index:100;background:#06080b;display:flex;align-items:center;justify-content:center;padding:20px}.menuBox,.nightBox,.trainingBox{width:min(720px,96vw);border:1px solid #38d9ff;background:#0b0f14;padding:28px;box-shadow:0 0 35px #00141b}.brand{font-size:clamp(34px,9vw,72px);letter-spacing:.12em;color:#38d9ff}.sub{color:#667387;margin:8px 0 26px}.menuButtons{display:grid;gap:10px}.status{margin:20px 0;color:#667387}.nightGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:25px 0}.nightBtn{min-height:70px}.nightBtn.selected{border-color:#e63946;color:#fff;box-shadow:inset 0 0 0 1px #e63946}.nightBtn.locked{color:#667387}.back{margin-top:8px}.trainingScreen{min-height:280px;border:1px solid #1a5f7a;padding:25px;position:relative;overflow:hidden}.trainingScreen:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(56,217,255,.035) 4px);pointer-events:none}.trainingPage h2{color:#38d9ff}.trainingPage p{line-height:1.65}.progress{margin-top:18px;color:#667387}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:15px}
#gameplay{display:none;min-height:100%;padding:12px}.layout{display:grid;grid-template-columns:220px 1fr;gap:12px;max-width:1200px;margin:auto}.panel{border:1px solid #1a5f7a;background:#0b0f14;padding:12px}.side{display:grid;gap:8px;align-content:start}.screen{min-height:500px}.map{height:230px;border:1px solid #667387;position:relative;margin-top:12px}.map-corridor{position:absolute;background:#667387}.c1{left:10%;top:45%;width:80%;height:2px}.c2{left:49%;top:15%;width:2px;height:70%}.c3{left:20%;top:25%;width:2px;height:45%}.c4{left:20%;top:25%;width:32%;height:2px;transform:rotate(-25deg);transform-origin:left center}.c5{left:52%;top:12%;width:32%;height:2px;transform:rotate(25deg);transform-origin:left center}.room{position:absolute;border:1px solid #38d9ff;padding:4px;font-size:11px}.office{left:5%;top:38%}.hall{right:5%;top:38%}.log{height:120px;overflow:auto;border:1px solid #1a5f7a;padding:8px;margin-top:12px}.power{margin:10px 0}.bar{height:12px;border:1px solid #667387}.fill{height:100%;background:#38d9ff;width:100%}@media(max-width:700px){.layout{grid-template-columns:1fr}.screen{min-height:380px}.nightGrid{grid-template-columns:repeat(2,1fr)}.menuBox,.nightBox,.trainingBox{padding:18px}.trainingScreen{min-height:300px}}
</style></head><body>
<div id="mainMenu"><div class="menuBox"><div class="brand">NORDIC</div><div class="sub">BLACKSITE-01 // NIGHT OPERATIONS</div><div id="menuStatus" class="status"></div><div class="menuButtons"><button onclick="beginShift()">BEGIN SHIFT</button><button onclick="openNightSelect()">SELECT NIGHT</button><button onclick="openTraining()">TRAINING VIDEO</button></div><div class="status">PERSONNEL SYSTEM // BUILD 01</div></div></div>
<div id="nightSelect"><div class="nightBox"><div class="brand" style="font-size:clamp(30px,7vw,58px)">SELECT NIGHT</div><div class="sub">BLACKSITE-01 // SHIFT ARCHIVE</div><div id="deviceId" class="status"></div><div id="nightGrid" class="nightGrid"></div><button class="back" onclick="closeNightSelect()">BACK</button></div></div>
<div id="training"><div class="trainingBox"><div class="brand" style="font-size:34px">PERSONNEL ORIENTATION</div><div class="sub">BLACKSITE-01 // TRAINING SIGNAL</div><div id="trainingScreen" class="trainingScreen"></div><div class="controls"><button onclick="trainingBack()">BACK</button><button onclick="trainingNext()">NEXT</button></div></div></div>
<div id="gameplay"><div class="layout"><div class="panel side"><b>NORDIC // NIGHT <span id="nightLabel">1</span></b><button onclick="camera(1)">CAMERA 01</button><button onclick="camera(2)">CAMERA 02</button><button onclick="camera(3)">CAMERA 03</button><button onclick="toggleDoor(0)">LEFT DOOR</button><button onclick="toggleDoor(1)">RIGHT DOOR</button><button onclick="light(0)">LEFT LIGHT</button><button onclick="light(1)">RIGHT LIGHT</button><button onclick="location.reload()">MENU</button></div><div class="panel screen"><h2 id="clock">11:00 PM</h2><div class="power">POWER <div class="bar"><div id="powerFill" class="fill"></div></div><span id="powerText">100%</span></div><p id="objective">Survive the shift. Watch the cameras. Don't let anything in.</p><div class="map"><div class="map-corridor c1"></div><div class="map-corridor c2"></div><div class="map-corridor c3"></div><div class="map-corridor c4"></div><div class="map-corridor c5"></div><div class="room office">SECURITY</div><div class="room hall">HALL A</div></div><div id="log" class="log"></div></div></div></div>
<script>
const KEY_DEVICE='nordicDeviceId',KEY_NIGHT='nordicUnlockedNight',KEY_TRAIN='nordicTrainingComplete';
function getDeviceId(){let id=localStorage.getItem(KEY_DEVICE);if(id)return id;do{id='NS-'+crypto.randomUUID().replace(/-/g,'').slice(0,20).toUpperCase()}while(id===localStorage.getItem(KEY_DEVICE));localStorage.setItem(KEY_DEVICE,id);return id}
const deviceId=getDeviceId();let unlocked=Number(localStorage.getItem(KEY_NIGHT)||1);if(unlocked<1)unlocked=1;let selectedNight=unlocked;
function menuInit(){document.getElementById('menuStatus').textContent=localStorage.getItem(KEY_TRAIN)==='1'?'ORIENTATION COMPLETE // PERSONNEL CLEARED':'NEW DEVICE DETECTED // ORIENTATION REQUIRED'}
function openNightSelect(){document.getElementById('mainMenu').style.display='none';document.getElementById('nightSelect').style.display='flex';document.getElementById('deviceId').textContent='DEVICE '+deviceId+' // SAVE SLOT ACTIVE';renderNights()}
function closeNightSelect(){document.getElementById('nightSelect').style.display='none';document.getElementById('mainMenu').style.display='flex'}
function renderNights(){const g=document.getElementById('nightGrid');g.innerHTML='';for(let n=1;n<=7;n++){const b=document.createElement('button');b.className='nightBtn'+(n===selectedNight?' selected':'')+(n>unlocked?' locked':'');b.disabled=n>unlocked;b.innerHTML='NIGHT '+String(n).padStart(2,'0')+(n>unlocked?'<br>LOCKED':'');b.onclick=()=>{selectedNight=n;renderNights()};g.appendChild(b)}}
function beginShift(){if(localStorage.getItem(KEY_TRAIN)!=='1'){openTraining();return}startGame()}
let tPage=0;const pages=[['WELCOME, NIGHT STAFF','You have been assigned to overnight security at BLACKSITE-01. Your shift begins at 11:00 PM.'],['THE CAMERA NETWORK','Monitor the facility cameras. Movement may not always remain where you last saw it.'],['OFFICE SYSTEMS','Two doors and two lights protect the office. Closed doors continuously consume extra power. Opening or closing a door does not take a large instant chunk.'],['FACILITY MAP','The map shows the security office, Junction, Hall A and the split routes through the facility.'],['WHEN SOMETHING MOVES','Watch. Wait. React. Use the cameras and office systems to manage what approaches.'],['END OF ORIENTATION','Survive until 06:00 AM. Do not let anything in. Orientation complete.']];
function openTraining(){document.getElementById('mainMenu').style.display='none';document.getElementById('training').style.display='flex';tPage=0;showTraining()}
function showTraining(){let p=pages[tPage];document.getElementById('trainingScreen').innerHTML='<div class="trainingPage"><div class="status">SIGNAL // '+String(tPage+1).padStart(2,'0')+'</div><h2>'+p[0]+'</h2><p>'+p[1]+'</p><div class="progress">MODULE '+(tPage+1)+' / '+pages.length+'</div></div>'}
function trainingBack(){if(tPage>0){tPage--;showTraining()}else{document.getElementById('training').style.display='none';document.getElementById('mainMenu').style.display='flex';menuInit()}}
function trainingNext(){if(tPage<pages.length-1){tPage++;showTraining()}else{localStorage.setItem(KEY_TRAIN,'1');document.getElementById('training').style.display='none';document.getElementById('mainMenu').style.display='flex';menuInit()}}
let power=100,doors=[false,false],lights=[false,false],seconds=0,timer=null;function setPower(){power=Math.max(0,power);document.getElementById('powerFill').style.width=power+'%';document.getElementById('powerText').textContent=Math.ceil(power)+'%'}
function log(x){let l=document.getElementById('log');if(l){l.innerHTML+='<div>'+x+'</div>';l.scrollTop=l.scrollHeight}}
function resetGame(){clearInterval(timer);power=100;doors=[false,false];lights=[false,false];seconds=0;setPower()}
function startGame(){document.getElementById('mainMenu').style.display='none';document.getElementById('nightSelect').style.display='none';document.getElementById('gameplay').style.display='block';document.getElementById('nightLabel').textContent=selectedNight;resetGame();document.getElementById('log').innerHTML='';log('BLACKSITE-01: night '+selectedNight+' initialized.');log('Objective: survive until 06:00.');log('Objective: do not let anything in.');timer=setInterval(tick,1000)}
function toggleDoor(i){doors[i]=!doors[i];log((doors[i]?'DOOR CLOSED: ':'DOOR OPEN: ')+(i?'RIGHT':'LEFT'))}
function light(i){if(!lights[i])power-=2;else power-=1;lights[i]=!lights[i];log((lights[i]?'LIGHT ON: ':'LIGHT OFF: ')+(i?'RIGHT':'LEFT'));setPower()}
function camera(i){log('CAMERA '+String(i).padStart(2,'0')+' selected.')}
function tick(){seconds++;let drain=.05+doors.filter(Boolean).length*.08+lights.filter(Boolean).length*.08;power-=drain;setPower();let h=23+Math.floor(seconds/30);if(h>=30){clearInterval(timer);if(selectedNight<7&&selectedNight>=unlocked){unlocked=selectedNight+1;localStorage.setItem(KEY_NIGHT,unlocked);log('SHIFT COMPLETE. NIGHT '+unlocked+' UNLOCKED.')}}let hh=h%24;let m=Math.floor((seconds%30)*2);let ap=hh>=12?'PM':'AM';let display=((hh%12)||12)+':'+String(m).padStart(2,'0')+' '+ap;document.getElementById('clock').textContent=display;if(power<=0){clearInterval(timer);log('POWER DEPLETED. SHIFT TERMINATED.')}}
menuInit();document.getElementById('nightSelect').style.display='none';document.getElementById('training').style.display='none';
</script></body></html>
