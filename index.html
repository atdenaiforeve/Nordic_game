<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NORDIC // BLACKSITE-01</title><style>body{margin:0;background:#020406;color:#c4ced8;font:14px Consolas,monospace}button{font:inherit;color:#dce5ec;background:#0b1117;border:2px solid #465461;padding:10px;min-height:44px;text-transform:uppercase;touch-action:manipulation}button:active{border-color:#38d9ff;color:#38d9ff}#menu{min-height:100vh;display:grid;place-items:center}.menu{width:min(680px,90vw);border:2px solid #465461;padding:28px;background:#080d12}.brand{font-size:clamp(36px,10vw,70px);color:#38d9ff}.menu button{display:block;width:100%;margin:8px 0;text-align:left}.night-select{display:none;margin-top:10px;padding:10px;border:2px solid #26343e;background:#05090d}.night-select button{font-size:12px}.back{margin-top:10px!important}.locked{opacity:.45}#game{display:none;padding:5px}.top{border:2px solid #465461;padding:10px;display:flex;justify-content:space-between}.office{position:relative;height:calc(100vh - 90px);min-height:570px;max-height:820px;margin-top:5px;border:2px solid #465461;overflow:hidden;background:linear-gradient(#0b1218,#05080b 60%,#020304)}.wall{position:absolute;inset:0}.ceiling{position:absolute;top:0;left:0;right:0;height:14%;background:#101920;border-bottom:2px solid #26333d}.ceiling:after{content:'';position:absolute;left:20%;right:20%;top:45%;height:4px;background:#52616c;box-shadow:0 0 20px #52616c}.floor{position:absolute;left:-10%;right:-10%;bottom:-8%;height:42%;background:linear-gradient(#0d151b,#020304);clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)}.sidewall{position:absolute;top:14%;bottom:0;width:28%;background:linear-gradient(90deg,#030506,#111a21)}.leftwall{left:0;clip-path:polygon(0 0,100% 9%,100% 91%,0 100%);border-right:2px solid #26333d}.rightwall{right:0;clip-path:polygon(0 9%,100% 0,100% 100%,0 91%);border-left:2px solid #26333d}.center{position:absolute;inset:0;transition:transform .3s}.monitor{position:absolute;z-index:5;left:50%;top:12%;transform:translateX(-50%);width:66%;height:47%;background:#071015;border:7px solid #26313a;box-shadow:0 0 0 3px #111820,0 25px 45px #000;overflow:hidden}.head{height:34px;border-bottom:2px solid #465461;padding:8px;background:#0c141a;font-size:9px;display:flex;justify-content:space-between}.body{padding:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.cell{border:1px solid #34434e;padding:7px}.cell span{display:block;color:#667487;font-size:8px}.cyan{color:#38d9ff}.green{color:#64d98b}.desk{position:absolute;z-index:4;left:7%;right:7%;bottom:4%;height:25%;border:3px solid #4a5965;background:linear-gradient(#141c23,#080c10);box-shadow:0 -12px 35px #000}.desk:before{content:'SECURITY DESK // SEATED POSITION';position:absolute;left:0;right:0;bottom:8%;text-align:center;color:#4c5965;font-size:8px}.deskbuttons{position:absolute;left:8%;right:8%;top:22px;display:grid;grid-template-columns:1fr 1fr;gap:5px}.nav{position:absolute;z-index:10;left:5px;right:5px;bottom:5px;display:flex;gap:5px}.nav button{flex:1;font-size:8px}.side{display:none;position:absolute;z-index:9;top:18%;bottom:17%;width:55%;padding:6px}.sidepanel{height:100%;border:2px solid #465461;background:#080d12;padding:7px;box-shadow:0 18px 30px #000}.door{height:58%;margin:8px auto;border:5px solid #26343e;background:#020406}.sidebuttons{display:grid;grid-template-columns:1fr 1fr;gap:6px}.leftside{left:1%}.rightside{right:1%}.view-left .center{transform:translateX(49%)}.view-right .center{transform:translateX(-49%)}.view-left .monitor,.view-right .monitor{opacity:.25}.view-left .leftside,.view-right .rightside{display:block}.log{height:60px;border:2px solid #465461;margin-top:5px;padding:6px;overflow:auto;font-size:9px;color:#667487}@media(min-width:801px){.monitor{width:52%;height:58%}.desk{left:18%;right:18%;height:24%}.side{width:34%}.view-left .center{transform:translateX(26%)}.view-right .center{transform:translateX(-26%)}}</style></head><body><div id="menu"><div class="menu"><div class="brand">NORDIC</div><p>BLACKSITE-01 // SECURITY NIGHT SHIFT</p><button onclick="showNights()">&gt; SELECT NIGHT</button><div id="nightSelect" class="night-select"><button onclick="start(1)">&gt; NIGHT 01 // SECURITY SHIFT</button><button class="locked" disabled>&gt; NIGHT 02 // LOCKED</button><button class="locked" disabled>&gt; NIGHT 03 // LOCKED</button><button class="back" onclick="hideNights()">&lt; BACK</button></div><button onclick="training()">&gt; TRAINING</button></div></div><div id="game"><div class="top"><b>NORDIC SECURITY OFFICE // BLACKSITE-01</b><span id="clock" class="cyan">11:00 PM</span></div><div class="office" id="office"><div class="wall"></div><div class="ceiling"></div><div class="sidewall leftwall"></div><div class="sidewall rightwall"></div><div class="floor"></div><div class="center"><div class="monitor"><div class="head"><b>MONITOR // SYSTEM INFO</b><span class="cyan">ONLINE</span></div><div class="body"><div class="cyan">NORDIC // SECURITY</div><div class="grid"><div class="cell"><span>NIGHT</span><span id="nightLabel">01</span></div><div class="cell"><span>CURRENT TIME</span><b id="mtime">11:00 PM</b></div><div class="cell"><span>POWER</span><b id="power">100%</b></div><div class="cell"><span>CAMERAS</span><b class="green">ONLINE</b></div></div></div></div><div class="desk"><div class="deskbuttons"><button onclick="alert('Monitor controls coming next.')">MONITOR</button><button onclick="alert('Systems controls coming next.')">SYSTEMS</button></div></div></div><div class="side leftside"><div class="sidepanel"><b class="cyan">LEFT ACCESS // HALL A</b><div class="door"></div><div class="sidebuttons"><button onclick="toggle(0)">DOOR</button><button onclick="light(0)">LIGHT</button></div></div></div><div class="side rightside"><div class="sidepanel"><b class="cyan">RIGHT ACCESS // HALL B</b><div class="door"></div><div class="sidebuttons"><button onclick="toggle(1)">DOOR</button><button onclick="light(1)">LIGHT</button></div></div></div><div class="nav"><button onclick="look('left')">&lt; LOOK LEFT</button><button onclick="look('center')">CENTER</button><button onclick="look('right')">LOOK RIGHT &gt;</button></div></div><div id="log" class="log">&gt; Office initialized.</div></div><script>let p=100,t=0,night=1,timer=null;function showNights(){nightSelect.style.display='block'}function hideNights(){nightSelect.style.display='none'}function start(n=1){night=n;menu.style.display='none';game.style.display='block';nightLabel.textContent=String(n).padStart(2,'0');if(timer)clearInterval(timer);timer=setInterval(()=>{t++;let h=(23+Math.floor(t/60))%24,m=t%60,dh=h%12||12,ap=h>=12?'PM':'AM',s=dh+':'+String(m).padStart(2,'0')+' '+ap;clock.textContent=s;mtime.textContent=s;p=Math.max(0,p-.03);power.textContent=Math.floor(p)+'%';if(t>=420){clearInterval(timer);alert('06:00 AM // SHIFT COMPLETE');}},1000);log.textContent='> Night '+String(n).padStart(2,'0')+' selected. You are seated at the security desk.'}function look(v){office.className='office view-'+v;log.textContent='> OFFICE VIEW // '+v.toUpperCase()}function toggle(i){log.textContent='> '+(i?'RIGHT':'LEFT')+' DOOR TOGGLED'}function light(i){p=Math.max(0,p-2);power.textContent=Math.floor(p)+'%';log.textContent='> '+(i?'RIGHT':'LEFT')+' LIGHT TOGGLED'}function training(){alert('Stay seated. Look left or right to access the doors and lights.')}</script></body></html>
