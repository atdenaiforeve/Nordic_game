<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NORDIC // BLACKSITE-01</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#05070a;color:#dce8ef;font:14px Consolas,monospace}body{overflow-x:hidden}button{font:inherit;color:#dce8ef;background:#0c141b;border:2px solid #40515e;padding:10px;min-height:44px;text-transform:uppercase;touch-action:manipulation;cursor:pointer;box-shadow:inset 0 0 0 1px #17242d,0 4px 12px #0008}button:active{border-color:#42dcff;color:#42dcff;transform:translateY(1px)}#menu{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#12303b 0,#071016 38%,#020304 80%)}.menu{width:min(680px,90vw);border:2px solid #45606d;padding:28px;background:linear-gradient(145deg,#111d24,#060a0e);box-shadow:0 25px 70px #000,0 0 40px #00b9ff18}.brand{font-size:clamp(36px,10vw,70px);color:#42dcff;text-shadow:0 0 18px #00cfff88}.menu button{display:block;width:100%;margin:8px 0;text-align:left}.night-select{display:block;margin-top:10px;padding:10px;border:2px solid #263b47;background:#05090d}.night-select button{font-size:12px}.back{margin-top:10px!important}.locked{opacity:.45}#game{display:none;padding:5px;background:#020407;min-height:100vh}.top{border:2px solid #435966;padding:10px;display:flex;justify-content:space-between;background:linear-gradient(90deg,#0b151c,#101d24,#081017);box-shadow:0 5px 18px #000}.cyan{color:#42dcff;text-shadow:0 0 8px #00bfff55}.green{color:#62ed93;text-shadow:0 0 8px #2cff7255}.office{position:relative;height:calc(100vh - 90px);min-height:570px;max-height:850px;margin-top:5px;border:2px solid #344955;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#18323a 0,#0b171d 35%,#04070a 78%);perspective:900px}.office:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 25%,#0008 78%,#000e 100%);pointer-events:none;z-index:20}.ceiling{position:absolute;top:0;left:0;right:0;height:19%;background:linear-gradient(#1c2b33,#101a20);border-bottom:3px solid #425560;box-shadow:0 10px 25px #000}.ceiling:before{content:'BLACKSITE-01 // SECURITY OFFICE';position:absolute;left:4%;top:25%;font-size:10px;color:#617681;letter-spacing:2px}.ceiling:after{content:'';position:absolute;left:18%;right:18%;top:55%;height:7px;background:linear-gradient(90deg,transparent,#dffaff,#7deaff,transparent);box-shadow:0 0 24px #54ddff,0 0 60px #18a9cc88}.floor{position:absolute;left:-12%;right:-12%;bottom:-12%;height:49%;background:repeating-linear-gradient(90deg,#0b1318 0 12px,#0e1920 13px 15px),linear-gradient(#16242a,#030507);clip-path:polygon(9% 0,91% 0,100% 100%,0 100%);border-top:2px solid #40545e;box-shadow:inset 0 30px 50px #000}.floor:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#0008,transparent 20%,transparent 80%,#0008)}.sidewall{position:absolute;top:17%;bottom:29%;width:30%;background:linear-gradient(90deg,#05090c,#17252d 50%,#071016);box-shadow:inset 0 0 35px #000}.leftwall{left:0;clip-path:polygon(0 0,100% 12%,100% 88%,0 100%);border-right:3px solid #354b57}.rightwall{right:0;clip-path:polygon(0 12%,100% 0,100% 100%,0 88%);border-left:3px solid #354b57}.sidewall:after{content:'';position:absolute;top:12%;bottom:12%;left:20%;width:4px;background:#20333d;box-shadow:35px 0 #0d171d,70px 0 #20333d}.center{position:absolute;inset:0;transition:transform .35s cubic-bezier(.2,.8,.2,1)}.backwall{position:absolute;z-index:1;left:17%;right:17%;top:17%;bottom:28%;background:linear-gradient(180deg,#15252d,#0b141a 55%,#060a0d);border:3px solid #2c414c;box-shadow:inset 0 0 45px #000,0 15px 30px #000}.backwall:before,.backwall:after{content:'';position:absolute;top:0;bottom:0;width:3px;background:#22343e}.backwall:before{left:18%}.backwall:after{right:18%}.monitor{position:absolute;z-index:5;left:50%;top:22%;transform:translateX(-50%);width:64%;height:42%;background:#050b0f;border:8px solid #354650;border-radius:5px;box-shadow:0 0 0 3px #101a20,0 18px 35px #000,0 0 35px #00bde722;overflow:hidden}.monitor:before{content:'';position:absolute;inset:0;background:linear-gradient(transparent 50%,#42dcff08 50%);background-size:100% 4px;pointer-events:none;z-index:2}.head{height:34px;border-bottom:2px solid #40535e;padding:8px;background:linear-gradient(#14232b,#0b141a);font-size:9px;display:flex;justify-content:space-between}.body{padding:10px;background:radial-gradient(circle at 50% 20%,#0c2028,#050b0f 70%)}.screen-title{font-size:12px;margin-bottom:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.cell{border:1px solid #354852;padding:8px;background:linear-gradient(145deg,#0b171e,#050a0e);box-shadow:inset 0 0 12px #000}.cell span{display:block;color:#71838e;font-size:8px}.cell b{font-size:15px}.desk{position:absolute;z-index:8;left:7%;right:7%;bottom:7%;height:25%;border:3px solid #526875;border-radius:4px;background:linear-gradient(180deg,#24343b 0,#111d23 15%,#080d11 70%,#05080a);box-shadow:0 -15px 45px #000,inset 0 2px 0 #8aa0aa44}.desk:before{content:'SECURITY DESK // SEATED POSITION';position:absolute;left:0;right:0;bottom:8%;text-align:center;color:#526872;font-size:8px;letter-spacing:1px}.desk:after{content:'';position:absolute;left:3%;right:3%;top:10%;height:4px;background:#40545d;box-shadow:0 0 10px #42dcff22}.deskbuttons{position:absolute;left:8%;right:8%;top:22px;display:grid;grid-template-columns:1fr 1fr;gap:7px}.deskbuttons button{background:linear-gradient(#182832,#0b141a);border-color:#526975}.keyboard{position:absolute;left:38%;right:38%;bottom:18%;height:18px;border:1px solid #52636d;background:repeating-linear-gradient(90deg,#26363e 0 8px,#0c1419 9px 11px);opacity:.8}.side{display:none;position:absolute;z-index:12;top:23%;bottom:29%;width:52%;padding:6px}.sidepanel{height:100%;border:3px solid #526875;border-radius:5px;background:linear-gradient(145deg,#15232a,#060b0f);padding:9px;box-shadow:0 20px 45px #000,inset 0 0 25px #000}.doorframe{height:68%;margin:10px auto;border:7px solid #344954;background:#010203;box-shadow:inset 0 0 35px #000,0 0 20px #000}.door{height:100%;background:linear-gradient(90deg,#020304,#071117 45%,#010203);position:relative}.door:after{content:'HALL // A';position:absolute;left:50%;top:10%;transform:translateX(-50%);font-size:9px;color:#344954;letter-spacing:2px}.sidebuttons{display:grid;grid-template-columns:1fr 1fr;gap:6px}.leftside{left:1%}.rightside{right:1%}.view-left .center{transform:translateX(49%)}.view-right .center{transform:translateX(-49%)}.view-left .monitor,.view-right .monitor{opacity:.22}.view-left .leftside,.view-right .rightside{display:block}.log{height:60px;border:2px solid #344955;margin-top:5px;padding:6px;overflow:auto;font-size:9px;color:#70818c;background:#05090c;box-shadow:inset 0 0 15px #000}@media(min-width:801px){.monitor{width:50%;height:46%;top:21%}.desk{left:17%;right:17%;height:24%}.side{width:33%}.view-left .center{transform:translateX(27%)}.view-right .center{transform:translateX(-27%)}}@media(max-width:520px){.office{min-height:560px}.backwall{left:10%;right:10%}.monitor{width:78%;height:40%;top:21%;border-width:6px}.desk{left:4%;right:4%;height:27%;bottom:5%}.deskbuttons{top:18px}.deskbuttons button{font-size:10px;padding:7px}.keyboard{display:none}.side{width:72%;top:21%;bottom:29%}.nav button{font-size:8px;padding:7px}.ceiling:before{font-size:7px}.cell{padding:6px}.cell b{font-size:13px}} </style></head><body><div id="menu"><div class="menu"><div class="brand">NORDIC</div><p>BLACKSITE-01 // SECURITY NIGHT SHIFT</p><button onclick="showNights()">&gt; SELECT NIGHT</button><div id="nightSelect" class="night-select"><button onclick="start(1)">&gt; NIGHT 01 // SECURITY SHIFT</button><button class="locked" disabled>&gt; NIGHT 02 // LOCKED</button><button class="locked" disabled>&gt; NIGHT 03 // LOCKED</button><button class="back" onclick="hideNights()">&lt; BACK</button></div><button onclick="training()">&gt; TRAINING</button></div></div><div id="game"><div class="top"><b>NORDIC SECURITY OFFICE // BLACKSITE-01</b><span id="clock" class="cyan">11:00 PM</span></div><div class="office" id="office"><div class="ceiling"></div><div class="sidewall leftwall"></div><div class="sidewall rightwall"></div><div class="floor"></div><div class="center"><div class="backwall"></div><div class="monitor"><div class="head"><b>MONITOR // SYSTEM INFO</b><span class="cyan">ONLINE</span></div><div class="body"><div class="screen-title cyan">NORDIC // SECURITY NETWORK</div><div class="grid"><div class="cell"><span>NIGHT</span><span id="nightLabel">01</span></div><div class="cell"><span>CURRENT TIME</span><b id="mtime">11:00 PM</b></div><div class="cell"><span>POWER</span><b id="power">100%</b></div><div class="cell"><span>CAMERAS</span><b class="green">ONLINE</b></div></div></div></div><div class="desk"><div class="deskbuttons"><button onclick="alert('Monitor controls coming next.')">MONITOR</button><button onclick="alert('Systems controls coming next.')">SYSTEMS</button></div><div class="keyboard"></div></div></div><div class="side leftside"><div class="sidepanel"><b class="cyan">LEFT ACCESS // HALL A</b><div class="doorframe"><div class="door"></div></div><div class="sidebuttons"><button onclick="toggle(0)">DOOR</button><button onclick="light(0)">LIGHT</button></div></div></div><div class="side rightside"><div class="sidepanel"><b class="cyan">RIGHT ACCESS // HALL B</b><div class="doorframe"><div class="door"></div></div><div class="sidebuttons"><button onclick="toggle(1)">DOOR</button><button onclick="light(1)">LIGHT</button></div></div></div><div class="nav"><button onclick="look('left')">&lt; LOOK LEFT</button><button onclick="look('center')">CENTER</button><button onclick="look('right')">LOOK RIGHT &gt;</button></div></div><div id="log" class="log">&gt; Office initialized.</div></div><script>let p=100,t=0,night=1,timer=null;function showNights(){nightSelect.style.display='block'}function hideNights(){nightSelect.style.display='none'}function start(n=1){night=n;menu.style.display='none';game.style.display='block';nightLabel.textContent=String(n).padStart(2,'0');if(timer)clearInterval(timer);timer=setInterval(()=>{t++;let h=(23+Math.floor(t/60))%24,m=t%60,dh=h%12||12,ap=h>=12?'PM':'AM',s=dh+':'+String(m).padStart(2,'0')+' '+ap;clock.textContent=s;mtime.textContent=s;p=Math.max(0,p-.03);power.textContent=Math.floor(p)+'%';if(t>=420){clearInterval(timer);alert('06:00 AM // SHIFT COMPLETE');}},1000);log.textContent='> Night '+String(n).padStart(2,'0')+' selected. You are seated at the security desk.'}function look(v){office.className='office view-'+v;log.textContent='> OFFICE VIEW // '+v.toUpperCase()}function toggle(i){log.textContent='> '+(i?'RIGHT':'LEFT')+' DOOR TOGGLED'}function light(i){p=Math.max(0,p-2);power.textContent=Math.floor(p)+'%';log.textContent='> '+(i?'RIGHT':'LEFT')+' LIGHT TOGGLED'}function training(){alert('Stay seated. Look left or right to access the doors and lights.')}</script></body></html>
