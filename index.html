<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NORDIC // BLACKSITE-01</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050607;color:#d9dfe3;font-family:monospace}body{display:grid;place-items:center}.menu{width:min(520px,calc(100% - 32px));padding:28px 22px;background:linear-gradient(145deg,#111619,#080a0b);border:1px solid #454d52;box-shadow:0 18px 60px #000b;text-align:center}.title{font-size:28px;letter-spacing:4px;margin-bottom:5px}.sub{color:#7f8a90;font-size:10px;margin-bottom:25px}.warning{color:#aab3b7;font-size:9px;margin:15px 0}.nights{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:12px 0 18px}.night{padding:13px 4px;background:#171c1f;color:#cbd2d5;border:1px solid #394146;border-radius:3px;font:12px monospace}.night.active{border-color:#3dd3df;background:#0c282c;color:#72e9f0}.start{width:100%;padding:13px;background:#182124;color:#e7edef;border:1px solid #4c5a60;border-radius:3px;font:bold 12px monospace}.start:active{background:#293438}.hint{margin-top:15px;color:#626d72;font-size:8px}@media(max-width:500px){.menu{padding:22px 15px}.title{font-size:22px}.nights{grid-template-columns:repeat(3,1fr)}}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:none}</style></head><body><main class="menu" id="menu"><div class="title">BLACKSITE-01</div><div class="sub">NORDIC SECURITY FACILITY // NIGHT OPERATIONS</div><div class="warning">FACILITY BUILD: STREAMED MULTI-CHUNK ENVIRONMENT</div><div class="nights" id="nights"></div><button class="start" id="start">ENTER SECURITY CONTROL</button><div class="hint">Night selection is now persistent for this session. More facility sectors can be added without rebuilding the office.</div></main><iframe id="game" title="NORDIC BLACKSITE-01"></iframe><script>const nights=document.getElementById('nights');let selected=1;for(let i=1;i<=5;i++){const b=document.createElement('button');b.className='night'+(i===1?' active':'');b.textContent='NIGHT '+i;b.onclick=()=>{selected=i;document.querySelectorAll('.night').forEach(x=>x.classList.remove('active'));b.classList.add('active');sessionStorage.setItem('nordicNight',String(i))};nights.appendChild(b)}selected=Number(sessionStorage.getItem('nordicNight')||1);document.querySelectorAll('.night')[selected-1].classList.add('active');document.getElementById('start').onclick=()=>{sessionStorage.setItem('nordicNight',String(selected));document.getElementById('menu').style.display='none';const f=document.getElementById('game');f.src='facility.html';f.style.display='block'};</script></body></html>
