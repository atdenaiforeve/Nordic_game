<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NORDIC // BLACKSITE-01 FACILITY</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050607;color:#d7dde2;font-family:monospace}#game{position:fixed;inset:0}.hud{position:fixed;inset:0;pointer-events:none;z-index:10}.top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px}.panel{background:#080a0dcc;border:1px solid #3b4247;box-shadow:0 8px 28px #000b;border-radius:3px;padding:8px 10px;font-size:10px}.objective{position:absolute;top:58px;left:50%;transform:translateX(-50%)}.controls{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.controls button{background:#121719e8;color:#dce4e8;border:1px solid #4b5358;border-radius:3px;padding:9px 11px;font:10px monospace;touch-action:manipulation}.controls button:active{background:#30373b}.look{position:fixed;top:0;bottom:82px;width:30%;z-index:6;touch-action:none}.look.left{left:0}.look.right{right:0}.status{position:absolute;left:10px;bottom:65px;font-size:9px;color:#8c999f}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#050607;z-index:99;text-align:center;font-size:13px}.loading small{display:block;color:#7c878d;margin-top:8px;font-size:9px}@media(max-width:700px){.panel{font-size:8px;padding:7px 8px}.controls button{font-size:8px;padding:8px 8px}.objective{top:53px;font-size:8px}.status{bottom:58px}}</style></head><body><div id="game"></div><div class="loading" id="loading">STARTING BLACKSITE-01 FACILITY...<small id="loadStatus">Loading 3D engine...</small></div><div class="hud"><div class="top"><div class="panel">BLACKSITE-01 // <span id="zone">SECURITY OFFICE</span></div><div class="panel"><span id="clock">11:00 PM</span> &nbsp; POWER <span id="power">100%</span></div></div><div class="objectiv ,.3,.75),paint:mat(0x34393c,.8),floor:mat(0x303437,.9),desk:mat(0x363b3d,.65),black:mat(0x080a0b,.85),cyan:new T.MeshStandardMaterial({color:0x09272b,emissive:0x08727c,emissiveIntensity:1.3,roughness:.25}),red:new T.MeshStandardMaterial({color:0x220406,emissive:0xff101a,emissiveIntensity:3,roughness:.3}),green:new T.MeshStandardMaterial({color:0x0b3522,emissive:0x22ff91,emissiveIntensity:1.4,roughness:.3}),paper:mat(0xa8a69d,.95)};function box(g,w,h,d,x,y,z,m=M.dark,cast=true){const q=new T.Mesh(new T.BoxGeometry(w,h,d),m);q.position.set(x,y,z);q.castShadow=cast;q.receiveShadow=true;g.add(q);return q}function cyl(g,r,h,x,y,z,m=M.dark,s=16){const q=new T.Mesh(new T.CylinderGeometry(r,r,h,s),m);q.position.set(x,y,z);q.castShadow=true;q.receiveShadow=true;g.add(q);return q}function labelScreen(g,x,y,z,text){const c=document.createElement('canvas');c.width=512;c.height=180;const p=c.getContext('2d');p.fillStyle='#061014';p.fillRect(0,0,512,180);p.fillStyle='#43d6df';p.font='bold 24px monospace';p.fillText(text,20,38);p.fillStyle='#9adfe4';p.font='15px monospace';p.fillText('BLACKSITE-01 // CCTV',20,70);p.fillText('ACCESS: RESTRICTED',20,100);p.fillStyle='#20464a';for(let i=0;i<5;i++)p.fillRect(20,120+i*10,470,2);const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;const q=new T.Mesh(new T.PlaneGeometry(2.35,1.15),new T.MeshStandardMaterial({map:t,emissive:0x07535b,emissiveIntensity:1.1}));q.position.set(x,y,z);g.add(q);return q}const chunks=new Map();function chunk(name,cx,cz,build){const g=new T.Group();g.name=name;g.userData={cx,cz,loaded:false,build};chunks.set(name,g);scene.add(g);return g}function room(g,w,d,x,z){box(g,w,.18,d,x,.09,z,M.floor,false);box(g,w,5.8,.28,x,2.9,z-d/2,M.concrete);box(g,.28,5.8,d,x-w/2,2.9,z,M.concrete);box(g,.28,5.8,d,x+w/2,2.9,z,M.concrete);box(g,w,.2,d,x,5.95,z,M.concrete,false)}function buildOffice(g){room(g,16,9,0,0);for(let x=-7;x<=7;x+=2)box(g,.035,5.7,.07,x,3,-4.32,M.dark,false);for(let x=-6;x<=6;x+=3)box(g,2.72,.05,8.35,x,5.84,0,M.dark,false);for(let z=-3.5;z<=3.5;z+=2)box(g,15.8,.02,.025,0,.2,z,M.dark,false);for(const s of[-1,1]){const x=s*6.05;box(g,3.25,5.35,.45,x,2.7,-4.18,M.dark);box(g,2.8,4.75,.16,x,2.52,-3.94,M.steel);box(g,.12,4.55,.2,x-1.4,2.5,-3.83,M.dark);box(g,.12,4.55,.2,x+1.4,2.5,-3.83,M.dark);box(g,.28,.44,.06,x+.92,2.55,-3.72,M.green)}box(g,7.5,1.05,2.25,0,1.22,2.35,M.desk);box(g,7.55,.15,2.3,0,1.78,2.35,M.black);for(const x of[-1.55,1.55]){box(g,2.9,1.7,.22,x,2.58,1.48,M.black);labelScreen(g,x,2.58,1.35,x<0?'CAM 01':'CAM 02');box(g,.1,1,.1,x,2.02,1.48,M.dark)}for(const x of[-2.9,2.9]){box(g,.9,.5,.7,x,2.03,2.35,M.black);box(g,.65,.06,.5,x,2.31,2.35,M.steel)}box(g,1.7,.06,.7,0,1.96,2.3,M.black);for(let i=0;i<8;i++)box(g,.05,.02,.18,-.35+i*.1,2,2.1,M.steel,false);cyl(g,.48,.72,0,1.18,4.35,M.black,24);box(g,1.1,.8,.16,0,1.62,4.35,M.black);for(const x of[-4.8,4.8]){box(g,1.2,1.6,.2,x,3.05,-4.02,M.dark);for(let y=2.5;y<3.8;y+=.3)box(g,.9,.035,.03,x,y,-3.9,M.steel,false)}for(const x of[-5.8,5.8]){cyl(g,.34,.07,x,5.55,-1.8,M.black);cyl(g,.18,.08,x,5.59,-1.8,M.green);box(g,.8,.05,.05,x,5.64,-1.8,M.steel,false)}box(g,1.5,2.8,.4,0,2.5,-4.18,M.black);for(let y=1.4;y<3.9;y+=.55){box(g,1.25,.35,.05,0,y,-3.94,M.steel,false);for(let i=0;i<4;i++)box(g,.06,.05,.18,-.45+i*.3,y+.08,-3.9,M.green,false)}}function buildHall(g,variant){room(g,14,14,0,0);for(let z=-6;z<=6;z+=2)box(g,13.4,.025,.035,0,.2,z,M.dark,false);for(let x=-5;x<=5;x+=2)box(g,.03,5.7,.06,x,3,-6.8,M.dark,false);for(let z=-5;z<=5;z+=2){box(g,.12,2.8,.18,-5.7,1.5,z,M.steel,false);box(g,.12,2.8,.18,5.7,1.5,z,M.steel,false)}for(const x of[-3.5,0,3.5]){box(g,1.9,.08,.7,x,5.55,0,M.dark,false);box(g,1.6,.04,.45,x,5.6,0,M.cyan,false)}if(variant==='BASEMENT'){for(let x=-4;x<=4;x+=2){box(g,.55,3.8,.55,x,1.9,-2.8,M.dark);for(let y=1;y<3.6;y+=.55)box(g,.45,.07,.45,x,y,-2.8,M.steel,false)}box(g,3,.12,1.2,0,4.8,3,M.dark);for(let i=0;i<8;i++)box(g,.15,.04,.8,-.55+i*.15,4.88,3,M.red,false)}}const office=chunk('SECURITY OFFICE',0,0,buildOffice);const hallA=chunk('JUNCTION HALL',1,0,g=>buildHall(g,'HALL'));const basement=chunk('BASEMENT',1,1,g=>buildHall(g,'BASEMENT'));const research=chunk('RESEARCH WING',0,-1,g=>buildHall(g,'RESEARCH'));function setChunkLoaded(c,on){if(c.userData.loaded===on)return;c.userData.loaded=on;if(on)c.userData.build(c);else while(c.children.length)c.remove(c.children[0])}function stream(cx,cz){let active=0;for(const c of chunks.values()){const dx=Math.abs(c.userData.cx-cx),dz=Math.abs(c.userData.cz-cz);const on=dx<=1&&dz<=1;setChunkLoaded(c,on);if(on)active++}document.getElementById('stream').textContent='STREAM: '+active+' CHUNKS ACTIVE / '+chunks.size+' TOTAL'}stream(0,0);const hemi=new T.HemisphereLight(0xc4c7c9,0x080a0b,.42);scene.add(hemi);const key=new T.DirectionalLight(0xdfe3e3,.35);key.position.set(0,7,5);key.castShadow=true;key.shadow.mapSize.set(1024,1024);key.shadow.camera.far=32;scene.add(key);const ceiling=new T.PointLight(0xe6e8e5,.35,18);ceiling.position.set(0,5.4,2);scene.add(ceiling);const red=new T.PointLight(0xff1018,.9,18);red.position.set(0,5,-1);red.castShadow=true;scene.add(red);const leftLight=new T.SpotLight(0xe7f6ff,0,10,Math.PI/5,.7,1);const rightLight=new T.SpotLight(0xe7f6ff,0,10,Math.PI/5,.7,1);leftLight.position.set(-6,3,-2);rightLight.position.set(6,3,-2);scene.add(leftLight,rightLight);const lt=new T.Object3D(),rt=new T.Object3D();lt.position.set(-6,1,-4);rt.position.set(6,1,-4);scene.add(lt,rt);leftLight.target=lt;rightLight.target=rt;let doors={L:false,R:false},doorObjs=[];office.traverse(o=>{if(o.isMesh&&o.position.z<-3.8&&o.position.x<-4&&o.position.x>-8)o.userData.leftDoor=true});function toggleDoor(k){doors[k]=!doors[k];const side=k==='L'?-6.05:6.05;office.children.filter(o=>o.isMesh&&Math.abs(o.position.x-side)<1.7&&o.position.z<-3.7&&o.geometry.type==='BoxGeometry').forEach(o=>{if(o.position.y>1.8)o.position.y=doors[k]?6.7:Math.min(o.position.y,4.8)})}document.getElementById('leftDoor').onclick=()=>toggleDoor('L');document.getElementById('rightDoor').onclick=()=>toggleDoor('R');document.getElementById('leftLight').onclick=()=>leftLight.intensity=leftLight.intensity?0:2.7;document.getElementById('rightLight').onclick=()=>rightLight.intensity=rightLight.intensity?0:2.7;let flash=true;const fp=new T.SpotLight(0xffffff,8,22,Math.PI/6,.72,1.1),ft=new T.Object3D();scene.add(fp,ft);fp.target=ft;document.getElementById('flashlight').onclick=()=>{flash=!flash;fp.intensity=flash?8:0;document.getElementById('flashlight').textContent='FLASHLIGHT: '+(flash?'ON':'OFF')};let view=0;const poses=[new T.Vector3(0,2.15,7.25),new T.Vector3(-2,2.2,7.25),new T.Vector3(2,2.2,7.25),new T.Vector3(0,2.25,6.1)];document.getElementById('camera').onclick=()=>{view=(view+1)%poses.length;camera.position.copy(poses[view]);stream(view===2?1:0,view===3?1:0)};document.getElementById('reboot').onclick=()=>power=Math.max(0,power-2);let power=100,seconds=0,yaw=0,pitch=0,lookSide=0;for(const z of[document.getElementById('lookLeft'),document.getElementById('lookRight')]){z.addEventListener('pointerdown',e=>{e.preventDefault();lookSide=z.id==='lookLeft'?-1:1;z.setPointerCapture?.(e.pointerId)},{passive:false});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>z.addEventListener(ev,()=>lookSide=0))}function update(){const total=23*60+seconds,h=Math.floor(total/60)%24,m=Math.floor(total)%60,hh=h===0?12:h>12?h-12:h;document.getElementById('clock').textContent=hh+':'+String(m).padStart(2,'0')+(h<12?' AM':' PM');document.getElementById('power').textContent=Math.round(power)+'%';document.getElementById('zone').textContent=view===3?'JUNCTION HALL':view===2?'BASEMENT':'SECURITY OFFICE'}let last=performance.now();function animate(now){const dt=Math.min(.1,(now-last)/1000);last=now;seconds+=dt;power=Math.max(0,power-dt*.018);update();const ty=lookSide===-1?-.82:lookSide===1?.82:0;yaw+=(ty-yaw)*Math.min(1,dt*12);if(!lookSide&&Math.abs(yaw)<.002)yaw=0;camera.rotation.y=yaw;camera.rotation.x+=(0-camera.rotation.x)*Math.min(1,dt*8);const p=camera.position;fp.position.copy(p);const dir=new T.Vector3(0,0,-1).applyQuaternion(camera.quaternion).normalize();ft.position.copy(p).addScaledVector(dir,12);renderer.render(scene,camera);requestAnimationFrame(animate)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false)});loading.classList.add('hidden');requestAnimationFrame(animate)}loadThree();</script></body></html>
