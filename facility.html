<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BLACKSITE-01 // SECURITY OFFICE</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151719;color:#e4e6e5;font-family:Arial,Helvetica,sans-serif}#game{position:fixed;inset:0}.hud{position:fixed;inset:0;pointer-events:none;z-index:10}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between}.panel{background:rgba(22,24,24,.72);border:1px solid rgba(220,220,215,.18);box-shadow:0 5px 20px rgba(0,0,0,.3);border-radius:3px;padding:8px 11px;font:11px Arial}.objective{position:absolute;top:55px;left:50%;transform:translateX(-50%);white-space:nowrap}.status{position:absolute;left:12px;bottom:76px;font:10px Arial;color:#c0c4c1}.controls{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;pointer-events:auto}.controls button{background:rgba(35,37,37,.88);color:#e7e9e8;border:1px solid #626866;border-radius:3px;padding:9px 12px;font:10px Arial;touch-action:manipulation}.controls button:active{background:#4d514f}.look{position:fixed;top:0;bottom:92px;width:30%;z-index:6;touch-action:none}.look.left{left:0}.look.right{right:0}.boot{position:fixed;inset:0;display:grid;place-items:center;background:#111315;z-index:99;text-align:center;font:13px Arial}.boot small{display:block;color:#aeb3b0;margin-top:10px;font-size:10px}.bar{width:min(340px,70vw);height:4px;background:#303331;margin-top:15px}.bar i{display:block;height:100%;width:0;background:#d1d4d1}@media(max-width:700px){.panel{font-size:9px;padding:7px 8px}.controls button{font-size:8px;padding:8px 9px}.objective{top:52px;font-size:8px}.status{bottom:63px;font-size:8px}}</style></head><body><div id="game"></div><div class="boot" id="boot"><div>BLACKSITE-01<small id="bootText">Preparing security office...</small><div class="bar"><i id="bar"></i></div></div></div><div class="hud"><div class="top"><div class="panel">BLACKSITE-01 // <span id="zone">SECURITY OFFICE</span></div><div class="panel"><span id="clock">11:00 PM</span> &nbsp; POWER <span id="power">100%</span></div></div><div class="objective panel">SECURITY SHIFT // REMAIN ON DUTY UNTIL 06:00</div><div class="status" id="status">SECURITY OFFICE // SYSTEMS AVAILABLE</div><div class="controls"><button id="leftDoor">LEFT DOOR</button><button id="rightDoor">RIGHT DOOR</button><button id="leftLight">LEFT LIGHT</button><button id="rightLight">RIGHT LIGHT</button><button id="camera">CAMERA</button><button id="flashlight">DESK LAMP</button></div></div><div class="look left" id="lookLeft"></div><div class="look right" id="lookRight"></div><script>const sources=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js'];let started=false;function loadThree(i=0){if(i>=sources.length){document.getElementById('bootText').textContent='3D engine unavailable.';return}const s=document.createElement('script');s.src=sources[i];s.onload=start;s.onerror=()=>loadThree(i+1);document.head.appendChild(s)}function start(){if(started)return;started=true;const T=THREE,game=document.getElementById('game'),scene=new T.Scene();scene.background=new T.Color(0x747873);scene.fog=new T.Fog(0x747873,18,70);const camera=new T.PerspectiveCamera(67,innerWidth/innerHeight,.05,100);camera.position.set(0,1.65,5.45);camera.rotation.order='YXZ';const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight,false);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;game.appendChild(renderer.domElement);function mat(c,r=.7,m=0){return new T.MeshStandardMaterial({color:c,roughness:r,metalness:m})}const M={floor:mat(0x4b4d4a,.82),wall:mat(0xb4b5af,.9),panel:mat(0x9b9d97,.82),trim:mat(0x303331,.65,.25),steel:mat(0x6d716d,.32,.72),dark:mat(0x202322,.48,.45),desk:mat(0x30312f,.48,.3),rubber:mat(0x171918,.92),paper:mat(0xd1cec3,.92),glass:new T.MeshPhysicalMaterial({color:0xb9cbc8,roughness:.18,metalness:0,transmission:.18,transparent:true,opacity:.38}),screen:new T.MeshStandardMaterial({color:0x15201f,roughness:.32,emissive:0x07100f,emissiveIntensity:.45}),white:new T.MeshStandardMaterial({color:0xe3e2d9,roughness:.48,emissive:0x999b94,emissiveIntensity:.18})};function box(g,w,h,d,x,y,z,m,cast=true){const q=new T.Mesh(new T.BoxGeometry(w,h,d),m);q.position.set(x,y,z);q.castShadow=cast;q.receiveShadow=true;g.add(q);return q}function cyl(g,r,h,x,y,z,m,s=20){const q=new T.Mesh(new T.CylinderGeometry(r,r,h,s),m);q.position.set(x,y,z);q.castShadow=true;q.receiveShadow=true;g.add(q);return q}const office=new T.Group();scene.add(office);
// Enclosed security office with believable architecture.
box(office,16,.16,13,0,.08,0,M.floor,false);box(office,16,5.3,.2,0,2.65,-6.5,M.wall);box(office,16,5.3,.2,0,2.65,6.5,M.wall);box(office,.2,5.3,13,-8,2.65,0,M.wall);box(office,.2,5.3,13,8,2.65,0,M.wall);box(office,16,.18,13,0,5.28,0,M.panel,false);for(const z of[-6.35,6.35]){box(office,15.7,.25,.12,0,.45,z,M.trim);box(office,15.7,.12,.1,0,4.9,z,M.trim)}for(const x of[-7.85,7.85])box(office,.12,.25,12.7,x,.45,0,M.trim,false);
function door(x){box(office,3.2,5.05,.28,x,2.52,-6.32,M.dark);box(office,2.82,4.68,.1,x,2.42,-6.12,M.steel);box(office,2.55,.08,.08,x,4.78,-6.02,M.trim);box(office,.1,4.55,.08,x-1.27,2.4,-6.02,M.trim);box(office,.1,4.55,.08,x+1.27,2.4,-6.02,M.trim);box(office,.55,.1,.06,x+.88,2.5,-5.96,M.steel);box(office,.08,.5,.08,x+.65,2.5,-5.9,M.dark)}door(-4.7);door(4.7);
for(const x of[-1.8,1.8]){box(office,1.45,2.25,.08,x,3.0,-6.03,M.glass,false);box(office,1.6,.08,.12,x,4.15,-5.97,M.trim);box(office,1.6,.08,.12,x,1.85,-5.97,M.trim);box(office,.08,2.25,.12,x-.76,3,-5.97,M.trim);box(office,.08,2.25,.12,x+.76,3,-5.97,M.trim)}
for(let x=-6;x<=6;x+=3)for(let z=-4;z<=4;z+=3)box(office,2.82,.045,2.82,x,5.22,z,M.panel,false);for(const x of[-4.5,0,4.5]){box(office,2.2,.07,.7,x,5.08,.4,M.steel,false);box(office,1.85,.035,.48,x,5.025,.4,M.white,false)}
// Main operator desk and four-monitor security station.
box(office,8.4,.82,2.05,0,.95,2.35,M.desk);box(office,8.15,.08,1.9,0,1.4,2.35,M.dark);for(const x of[-3.25,-1.65,0,1.65,3.25]){box(office,.12,.85,.12,x,.5,2.35,M.steel);box(office,.48,.08,.65,x,.08,2.35,M.steel)}for(const x of[-2.75,-.92,.92,2.75]){box(office,1.55,1.0,.1,x,2.12,1.65,M.dark);box(office,1.4,.83,.035,x,2.12,1.59,M.screen,false);box(office,.09,.48,.08,x,1.58,1.72,M.steel);box(office,.55,.06,.34,x,1.35,1.82,M.rubber,false);box(office,.72,.035,.28,x,1.43,2.05,M.paper,false)}for(const x of[-3.0,3.0]){box(office,1.05,.72,.75,x,1.68,3.0,M.dark);box(office,.82,.04,.52,x,2.05,2.98,M.screen,false)}box(office,.7,.025,.8,-1.8,1.44,2.9,M.paper,false);cyl(office,.22,.08,1.65,1.52,2.82,M.dark,24);
// Chair, cabinets, server rack and wall equipment.
cyl(office,.72,.16,0,.72,4.15,M.dark);cyl(office,.08,.72,0,.42,4.15,M.steel);for(let a=0;a<Math.PI*2;a+=Math.PI/2)box(office,.65,.07,.09,Math.sin(a)*.5,.08,4.15+Math.cos(a)*.5,M.steel);box(office,1.2,1.65,.25,0,1.55,4.25,M.dark);box(office,1.35,.18,.72,0,2.38,4.22,M.dark);function cabinet(x,z){box(office,1.25,2.55,.7,x,1.28,z,M.steel);for(let y=.62;y<2.3;y+=.52){box(office,1.0,.05,.06,x,y,z-.37,M.trim);box(office,.06,.08,.2,x+.35,y+.08,z-.4,M.dark)}}cabinet(-6.65,3.8);cabinet(6.65,3.8);box(office,2.0,4.25,.72,6.55,2.15,-4.65,M.dark);for(let y=.55;y<4;y+=.65){box(office,1.65,.06,.5,6.55,y,-4.25,M.steel);for(let x=-.6;x<=.6;x+=.3)cyl(office,.035,.22,6.55+x,y+.16,-4.2,M.rubber,10)}box(office,2.4,1.55,.1,-6.1,2.8,-6.02,M.steel);for(let y=2.2;y<3.9;y+=.32)box(office,1.8,.04,.06,-6.1,y,-5.94,M.dark);box(office,2.2,.8,.12,5.4,4.25,6.35,M.dark);for(let x=4.55;x<6.3;x+=.25)box(office,.06,.6,.04,x,4.25,6.27,M.steel,false);for(const x of[-5.8,-5.1,5.1,5.8]){box(office,.12,.12,.08,x,1.2,-6.05,M.steel,false);box(office,.05,.06,.03,x-.12,1.22,-5.98,M.dark,false);box(office,.05,.06,.03,x+.12,1.22,-5.98,M.dark,false)}
// Cable tray and vertical cable drops behind the desk.
box(office,6.8,.12,.18,0,3.25,5.8,M.trim,false);for(const x of[-2.8,-1.4,0,1.4,2.8])cyl(office,.025,1.8,x,1.75,1.15,M.dark,10);
scene.add(new T.HemisphereLight(0xd8ddd8,0x40423f,1.25));const key=new T.RectAreaLight(0xf2f0e7,4.2,7,3);key.position.set(0,5,1);key.rotation.x=Math.PI/2;scene.add(key);for(const x of[-4.5,0,4.5]){const l=new T.PointLight(0xf0eee4,3.2,13,2);l.position.set(x,4.75,.4);l.castShadow=true;l.shadow.mapSize.set(512,512);scene.add(l)}
// Corridor geometry sits outside the office; the player never spawns there.
for(const x of[-4.7,4.7]){box(scene,3.8,.12,13,x,.07,-13,M.floor,false);box(scene,3.8,4.8,.15,x,2.4,-19.4,M.wall);box(scene,.15,4.8,13,x-1.9,2.4,-13,M.wall);box(scene,.15,4.8,13,x+1.9,2.4,-13,M.wall)}
let yaw=0,targetYaw=0;function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function look(){camera.rotation.y=yaw;camera.rotation.x=.01}function setLook(d){targetYaw=clamp(targetYaw+d,-.72,.72)}document.getElementById('lookLeft').addEventListener('pointerdown',e=>{e.preventDefault();setLook(-.18)});document.getElementById('lookRight').addEventListener('pointerdown',e=>{e.preventDefault();setLook(.18)});
let leftClosed=true,rightClosed=true,leftLit=false,rightLit=false,deskOn=true;const status=document.getElementById('status');function st(t){status.textContent=t}document.getElementById('leftDoor').onclick=()=>{leftClosed=!leftClosed;st('LEFT DOOR // '+(leftClosed?'SECURED':'OPEN'))};document.getElementById('rightDoor').onclick=()=>{rightClosed=!rightClosed;st('RIGHT DOOR // '+(rightClosed?'SECURED':'OPEN'))};document.getElementById('leftLight').onclick=()=>{leftLit=!leftLit;st('LEFT SECURITY LIGHT // '+(leftLit?'ON':'OFF'))};document.getElementById('rightLight').onclick=()=>{rightLit=!rightLit;st('RIGHT SECURITY LIGHT // '+(rightLit?'ON':'OFF'))};document.getElementById('flashlight').onclick=()=>{deskOn=!deskOn;st('DESK LAMP // '+(deskOn?'ON':'OFF'))};document.getElementById('camera').onclick=()=>st('CAMERA SYSTEM // SECURITY OFFICE VIEW');
let minutes=23*60;setInterval(()=>{minutes++;if(minutes>=1440)minutes=0;const h24=Math.floor(minutes/60),m=minutes%60,ap=h24>=12?'PM':'AM',h=h24%12||12;document.getElementById('clock').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+' '+ap},1000);function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false)}addEventListener('resize',resize);function animate(){requestAnimationFrame(animate);yaw+=(targetYaw-yaw)*.08;look();renderer.render(scene,camera)}setTimeout(()=>{document.getElementById('boot').style.display='none';document.getElementById('bar').style.width='100%'},650);animate()}loadThree();</script></body></html>
