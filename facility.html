<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BLACKSITE-01 // SECURITY OFFICE</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17191a;color:#e7e9e8;font-family:Arial,Helvetica,sans-serif}#game{position:fixed;inset:0}.hud{position:fixed;inset:0;pointer-events:none;z-index:10}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between}.panel{background:rgba(20,23,24,.78);border:1px solid rgba(210,215,213,.2);box-shadow:0 5px 22px rgba(0,0,0,.35);border-radius:4px;padding:8px 11px;font:11px Arial}.objective{position:absolute;top:56px;left:50%;transform:translateX(-50%);white-space:nowrap}.status{position:absolute;left:12px;bottom:78px;font:10px Arial;color:#b8bfbd}.controls{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;pointer-events:auto}.controls button{background:rgba(35,38,39,.9);color:#e9eceb;border:1px solid #69706f;border-radius:4px;padding:9px 12px;font:10px Arial;touch-action:manipulation}.controls button:active{background:#505654}.look{position:fixed;top:0;bottom:92px;width:28%;z-index:6;touch-action:none}.look.left{left:0}.look.right{right:0}.boot{position:fixed;inset:0;display:grid;place-items:center;background:#111415;z-index:99;text-align:center;font:13px Arial}.boot small{display:block;color:#a8afad;margin-top:10px;font-size:10px}.bar{width:min(340px,70vw);height:4px;background:#303535;margin-top:15px}.bar i{display:block;height:100%;width:0;background:#d7d9d7}.hidden{display:none}@media(max-width:700px){.panel{font-size:9px;padding:7px 8px}.controls button{font-size:8px;padding:8px 9px}.objective{top:52px;font-size:8px}.status{bottom:63px;font-size:8px}}</style></head><body><div id="game"></div><div class="boot" id="boot"><div>BLACKSITE-01<small id="bootText">Preparing security office...</small><div class="bar"><i id="bar"></i></div></div></div><div class="hud"><div class="top"><div class="panel">BLACKSITE-01 // <span id="zone">SECURITY OFFICE</span></div><div class="panel"><span id="clock">11:00 PM</span> &nbsp; POWER <span id="power">100%</span></div></div><div class="objective panel">SECURITY SHIFT // REMAIN ON DUTY UNTIL 06:00</div><div class="status" id="status">SECURITY OFFICE // ALL SYSTEMS AVAILABLE</div><div class="controls"><button id="leftDoor">LEFT DOOR</button><button id="rightDoor">RIGHT DOOR</button><button id="leftLight">LEFT LIGHT</button><button id="rightLight">RIGHT LIGHT</button><button id="camera">CAMERA</button><button id="flashlight">DESK LAMP</button></div></div><div class="look left" id="lookLeft"></div><div class="look right" id="lookRight"></div><script>const sources=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js'];let started=false;function loadThree(i=0){if(i>=sources.length){document.getElementById('bootText').textContent='3D engine unavailable.';return}const s=document.createElement('script');s.src=sources[i];s.onload=start;s.onerror=()=>loadThree(i+1);document.head.appendChild(s)}function start(){if(started)return;started=true;const T=THREE,game=document.getElementById('game');const scene=new T.Scene();scene.background=new T.Color(0x25292a);scene.fog=new T.Fog(0x25292a,35,105);const camera=new T.PerspectiveCamera(66,innerWidth/innerHeight,.05,160);camera.position.set(0,1.72,7.8);camera.rotation.order='YXZ';const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight,false);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;game.appendChild(renderer.domElement);
function texture(draw,w=512,h=512){const c=document.createElement('canvas');c.width=w;c.height=h;const p=c.getContext('2d');draw(p,w,h);const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;t.wrapS=t.wrapT=T.RepeatWrapping;return t}function mat(c,r=.75,m=0){return new T.MeshStandardMaterial({color:c,roughness:r,metalness:m})}const floorTex=texture((p,w,h)=>{p.fillStyle='#4a4b49';p.fillRect(0,0,w,h);for(let y=0;y<h;y+=64){p.strokeStyle='rgba(20,22,21,.5)';p.lineWidth=2;p.beginPath();p.moveTo(0,y);p.lineTo(w,y);p.stroke()}for(let x=0;x<w;x+=64){p.strokeStyle='rgba(20,22,21,.38)';p.beginPath();p.moveTo(x,0);p.lineTo(x,h);p.stroke()}for(let i=0;i<700;i++){p.fillStyle='rgba(255,255,255,'+(Math.random()*.035)+')';p.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*3,1+Math.random()*3)}},512,512);floorTex.repeat.set(8,8);const wallTex=texture((p,w,h)=>{p.fillStyle='#b8b9b4';p.fillRect(0,0,w,h);for(let i=0;i<900;i++){const v=80+Math.random()*45;p.fillStyle='rgba('+v+','+v+','+(v-2)+',.12)';p.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*4,1+Math.random()*4)}p.fillStyle='rgba(80,82,80,.35)';p.fillRect(0,h-14,w,14)},512,512);wallTex.repeat.set(2,2);const ceilingTex=texture((p,w,h)=>{p.fillStyle='#d5d5cf';p.fillRect(0,0,w,h);for(let y=0;y<h;y+=64){p.strokeStyle='rgba(100,100,95,.35)';p.strokeRect(.5,y+.5,w-1,63)}for(let x=0;x<w;x+=64){p.strokeStyle='rgba(100,100,95,.2)';p.beginPath();p.moveTo(x,0);p.lineTo(x,h);p.stroke()}},512,512);ceilingTex.repeat.set(8,8);const M={floor:new T.MeshStandardMaterial({map:floorTex,roughness:.88}),wall:new T.MeshStandardMaterial({map:wallTex,roughness:.94}),ceiling:new T.MeshStandardMaterial({map:ceilingTex,roughness:.96}),paint:mat(0x5e625f,.8),trim:mat(0x252827,.7,.35),steel:mat(0x777c79,.27,.72),darkSteel:mat(0x343837,.42,.65),desk:mat(0x3a3b39,.48,.25),black:mat(0x101212,.6),rubber:mat(0x1a1b1a,.96),paper:mat(0xd2d0c7,.9),wood:mat(0x66564a,.7),glass:new T.MeshPhysicalMaterial({color:0xb8d1cf,roughness:.12,metalness:0,transmission:.1,transparent:true,opacity:.4})};function box(g,w,h,d,x,y,z,m=M.trim,cast=true){const q=new T.Mesh(new T.BoxGeometry(w,h,d),m);q.position.set(x,y,z);q.castShadow=cast;q.receiveShadow=true;g.add(q);return q}function cyl(g,r,h,x,y,z,m=M.trim,s=20){const q=new T.Mesh(new T.CylinderGeometry(r,r,h,s),m);q.position.set(x,y,z);q.castShadow=true;q.receiveShadow=true;g.add(q);return q}function plane(g,w,h,x,y,z,m,ry=0){const q=new T.Mesh(new T.PlaneGeometry(w,h),m);q.position.set(x,y,z);q.rotation.y=ry;g.add(q);return q}function textTexture(title,sub=''){return texture((p,w,h)=>{p.fillStyle='#171918';p.fillRect(0,0,w,h);p.strokeStyle='#737873';p.lineWidth=5;p.strokeRect(5,5,w-10,h-10);p.fillStyle='#e1e4e0';p.font='bold 46px Arial';p.fillText(title,26,72);if(sub){p.fillStyle='#aeb5b0';p.font='24px Arial';p.fillText(sub,27,108)}},512,160)}function sign(g,x,y,z,title,sub=''){const m=new T.MeshStandardMaterial({map:textTexture(title,sub),roughness:.7});plane(g,2.5,.78,x,y,z,m,Math.PI);}
const facility=new T.Group();scene.add(facility);const office=new T.Group();facility.add(office);function roomShell(g,w,d,x,z){box(g,w,.14,d,x,.07,z,M.floor,false);box(g,w,5.2,.22,x,2.6,z-d/2,M.wall);box(g,w,5.2,.22,x,2.6,z+d/2,M.wall);box(g,.22,5.2,d,x-w/2,2.6,z,M.wall);box(g,.22,5.2,d,x+w/2,2.6,z,M.wall);box(g,w,.16,d,x,5.22,z,M.ceiling,false);box(g,w,.22,.28,x,.35,z-d/2+.15,M.trim);box(g,w,.22,.28,x,4.95,z-d/2+.15,M.trim)}roomShell(office,16,13,0,0);const corridorMat=M.floor;function corridor(g,x,z,w,d){box(g,w,.14,d,x,.07,z,corridorMat,false);box(g,w,5.2,.22,x,2.6,z-d/2,M.wall);box(g,w,5.2,.22,x,2.6,z+d/2,M.wall);box(g,.22,5.2,d,x-w/2,2.6,z,M.wall);box(g,.22,5.2,d,x+w/2,2.6,z,M.wall);box(g,w,.16,d,x,5.22,z,M.ceiling,false)}corridor(facility,10,0,20,5);corridor(facility,-10,0,20,5);corridor(facility,20,10,5,20);corridor(facility,-20,10,5,20);corridor(facility,0,20,40,5);corridor(facility,0,-20,40,5);
// Realistic office entrance wall with two separate doors; left/right are correct from the player's viewpoint.
function securityDoor(x,labelText){box(office,3.05,5.05,.22,x,2.55,-6.38,M.darkSteel);box(office,2.7,4.72,.08,x,2.42,-6.22,M.steel);box(office,2.56,.09,.14,x,4.72,-6.14,M.trim);box(office,.12,4.55,.12,x-1.28,2.42,-6.12,M.trim);box(office,.12,4.55,.12,x+1.28,2.42,-6.12,M.trim);box(office,.08,4.1,.08,x+.93,2.4,-6.04,M.darkSteel);box(office,.5,.12,.06,x+.88,2.55,-6.0,M.steel);sign(office,x,4.1,-6.03,labelText,'SECURITY ACCESS')}const doorL=securityDoor(-5.0,'LEFT');const doorR=securityDoor(5.0,'RIGHT');
// Desk, monitors and ordinary workplace equipment.
box(office,8.2,.9,2.25,0,.98,2.7,M.desk);box(office,8.05,.08,2.12,0,1.46,2.7,M.black);for(const x of[-2.7,-1.35,0,1.35,2.7]){box(office,.55,.05,.55,x,1.49,2.7,M.rubber);box(office,.06,.9,.06,x,1.9,2.7,M.darkSteel)}for(const x of[-2.55,-.85,.85,2.55]){box(office,1.45,1.0,.09,x,2.23,1.95,M.black);box(office,1.3,.84,.035,x,2.23,1.89,new T.MeshStandardMaterial({color:0x17201f,roughness:.35,emissive:0x07100e,emissiveIntensity:.18}));box(office,.08,.55,.08,x,1.72,2.02,M.darkSteel);box(office,.48,.06,.3,x,1.67,2.05,M.black)}for(const x of[-3.1,3.1]){box(office,1.15,.75,.78,x,1.7,3.25,M.black);box(office,.88,.04,.56,x,2.08,3.25,M.steel)}for(let i=-2;i<=2;i++)box(office,.16,.05,.9,i*.7,1.54,2.7,M.paper,false);for(const x of[-2.8,2.8]){cyl(office,.65,.08,x,1.53,2.7,M.steel);cyl(office,.25,.1,x,1.58,2.7,M.black)}
// Office chair
cyl(office,.75,.18,0,.72,4.0,M.black);cyl(office,.09,.7,0,.43,4.0,M.darkSteel);for(let a=0;a<Math.PI*2;a+=Math.PI/2.5){box(office,.65,.08,.08,Math.sin(a)*.5,.12+0,4+Math.cos(a)*.5,M.darkSteel)}box(office,1.25,1.8,.25,0,1.48,4.08,M.black);box(office,1.35,.2,.75,0,2.25,4.05,M.black);
// Filing cabinets, server rack, shelves and equipment.
function cabinet(x,z){box(office,1.35,2.6,.65,x,1.3,z,M.darkSteel);for(let y=.5;y<2.5;y+=.5){box(office,1.05,.05,.05,x,y,z-.35,M.steel);box(office,.08,.08,.25,x+.38,y+.1,z-.37,M.steel)}}cabinet(-6.5,3.9);cabinet(6.5,3.9);for(let y=.5;y<4.7;y+=.72){box(office,2.2,.06,.7,-6.55,y,-4.65,M.darkSteel);box(office,2.05,.5,.08,-6.55,y+.27,-4.28,M.paper,false)}box(office,2.3,4.7,.7,6.55,2.35,-4.65,M.darkSteel);for(let y=.5;y<4.5;y+=.65){box(office,1.95,.05,.48,6.55,y,-4.25,M.steel,false);for(let x=-.6;x<=.6;x+=.3)cyl(office,.035,.28,6.55+x,y+.18,-4.22,M.black,10)}
// Ceiling panels and practical fluorescent fixtures
for(let x=-6;x<=6;x+=3){box(office,2.15,.07,.8,x,5.05,.25,M.steel,false);box(office,1.75,.035,.55,x,5.0,.25,new T.MeshStandardMaterial({color:0xe5e4db,roughness:.5,emissive:0xbfc3bd,emissiveIntensity:.35}),false)}
// Realistic wall details: skirting, conduit, outlets and vents.
for(let x=-7;x<=7;x+=1.4)box(office,.8,.18,.05,x,.42,-6.22,M.trim,false);for(const x of[-6.9,-5.9,5.9,6.9]){box(office,.22,.8,.05,x,2.0,-6.2,M.steel);box(office,.1,.45,.03,x,2.0,-6.16,M.black)}for(let x=-5;x<=5;x+=2.5){box(office,1.3,.75,.05,x,3.85,-6.2,M.steel,false);box(office,1.05,.52,.03,x,3.85,-6.16,M.darkSteel,false)}
// Corridors beyond the office: believable structural rhythm, lights, signs and doors.
const areas=[{x:20,z:0,n:'JUNCTION HALL'},{x:-20,z:0,n:'MAINTENANCE'},{x:0,z:20,n:'RESEARCH'},{x:0,z:-20,n:'GENERATOR'}];for(const a of areas){sign(facility,a.x,3.9,a.z-2.55,a.n,'BLACKSITE-01');for(let y=0;y<5;y+=1){box(facility,.06,.75,.06,a.x-2.15,y+.65,a.z,M.darkSteel,false);box(facility,.06,.75,.06,a.x+2.15,y+.65,a.z,M.darkSteel,false)}}for(const x of[-17,-12,-7,7,12,17])box(facility,2.0,.06,1.0,x,5.0,20,new T.MeshStandardMaterial({color:0xe0dfd7,roughness:.55,emissive:0xbfc1ba,emissiveIntensity:.25}),false);
// Lights: broad neutral practical illumination, no alarm colouring.
const lights=[];for(const p of[[0,4.75,0],[0,4.75,-4],[0,4.75,4],[-5,4.75,0],[5,4.75,0],[20,4.75,0],[-20,4.75,0],[0,4.75,20],[0,4.75,-20]]){const l=new T.PointLight(0xf0eee6,.48,12);l.position.set(...p);l.castShadow=true;l.shadow.mapSize.set(512,512);lights.push(l);scene.add(l)}const hemi=new T.HemisphereLight(0xd7d9d4,0x343535,.48);scene.add(hemi);const sun=new T.DirectionalLight(0xfff6e8,.65);sun.position.set(-8,12,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-35;sun.shadow.camera.right=35;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;scene.add(sun);
const leftLamp=new T.SpotLight(0xf2eee0,0,11,Math.PI/4,.7,1);leftLamp.position.set(-5,3,-4);const lt=new T.Object3D();lt.position.set(-5,1,-6);scene.add(leftLamp,lt);leftLamp.target=lt;const rightLamp=new T.SpotLight(0xf2eee0,0,11,Math.PI/4,.7,1);rightLamp.position.set(5,3,-4);const rt=new T.Object3D();rt.position.set(5,1,-6);scene.add(rightLamp,rt);rightLamp.target=rt;
let leftClosed=true,rightClosed=true;function setDoor(which,closed){const x=which==='L'?-5:5;const obj=which==='L'?doorL:doorR;const target=closed?2.55:5.5;obj.position.y=target-2.55;obj.traverse(o=>{if(o.isMesh)o.visible=closed||o.position.y>-.5})}document.getElementById('leftDoor').onclick=()=>{leftClosed=!leftClosed;setDoor('L',leftClosed);document.getElementById('status').textContent='LEFT SECURITY DOOR '+(leftClosed?'CLOSED':'OPEN')};document.getElementById('rightDoor').onclick=()=>{rightClosed=!rightClosed;setDoor('R',rightClosed);document.getElementById('status').textContent='RIGHT SECURITY DOOR '+(rightClosed?'CLOSED':'OPEN')};document.getElementById('leftLight').onclick=()=>leftLamp.intensity=leftLamp.intensity?0:2.2;document.getElementById('rightLight').onclick=()=>rightLamp.intensity=rightLamp.intensity?0:2.2;let deskLamp=false;const dl=new T.PointLight(0xffe9c8,0,6);dl.position.set(3.1,2.2,3.25);scene.add(dl);document.getElementById('flashlight').onclick=()=>{deskLamp=!deskLamp;dl.intensity=deskLamp?1.3:0;document.getElementById('flashlight').textContent='DESK LAMP: '+(deskLamp?'ON':'OFF')};
let view=0;const poses=[{p:[0,1.72,7.8],n:'SECURITY OFFICE'},{p:[-3.8,1.72,7.8],n:'SECURITY OFFICE // LEFT'},{p:[3.8,1.72,7.8],n:'SECURITY OFFICE // RIGHT'},{p:[20,1.72,0],n:'JUNCTION HALL'},{p:[0,1.72,20],n:'RESEARCH HALL'},{p:[-20,1.72,0],n:'MAINTENANCE HALL'}];document.getElementById('camera').onclick=()=>{view=(view+1)%poses.length;camera.position.set(...poses[view].p);camera.rotation.set(0,0,0);document.getElementById('zone').textContent=poses[view].n;document.getElementById('status').textContent='SECURITY CAMERA // VIEW '+(view+1)+' OF '+poses.length};
let seconds=0,power=100,nightStarted=false,yaw=0;const selected=Number(sessionStorage.getItem('nordicNight')||1);function update(){const total=23*60+seconds,h=Math.floor(total/60)%24,m=Math.floor(total)%60,hh=h===0?12:h>12?h-12:h;document.getElementById('clock').textContent=hh+':'+String(m).padStart(2,'0')+(h<12?' AM':' PM');document.getElementById('power').textContent=Math.max(0,Math.round(power))+'%'}let last=performance.now(),look=0;function bindLook(id,side){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();look=side;el.setPointerCapture?.(e.pointerId)},{passive:false});for(const ev of['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>look=0)}bindLook('lookLeft',-1);bindLook('lookRight',1);function animate(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(nightStarted){seconds+=dt;power=Math.max(0,power-dt*.018)}update();const target=look<0?-0.72:look>0?.72:0;yaw+=(target-yaw)*Math.min(1,dt*8);camera.rotation.y=yaw;camera.rotation.x*=Math.max(0,1-dt*5);renderer.render(scene,camera);requestAnimationFrame(animate)}let prog=0;document.getElementById('bootText').textContent='Preparing realistic security office // NIGHT '+selected;const timer=setInterval(()=>{prog+=7;document.getElementById('bar').style.width=Math.min(100,prog)+'%';if(prog<35)document.getElementById('bootText').textContent='Loading building systems...';else if(prog<70)document.getElementById('bootText').textContent='Loading office equipment...';else if(prog<95)document.getElementById('bootText').textContent='Checking security cameras...';else document.getElementById('bootText').textContent='Starting night shift...';if(prog>=100){clearInterval(timer);setTimeout(()=>{nightStarted=true;document.getElementById('boot').classList.add('hidden')},700)}},100);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false)});requestAnimationFrame(animate)}loadThree();</script></body></html>
