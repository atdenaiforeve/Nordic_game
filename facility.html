<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BLACKSITE-01 // SECURITY OFFICE</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171918;color:#e4e6e5;font-family:Arial,Helvetica,sans-serif}#game{position:fixed;inset:0}.hud{position:fixed;inset:0;pointer-events:none;z-index:10}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between}.panel{background:rgba(22,24,24,.74);border:1px solid rgba(220,220,215,.18);box-shadow:0 5px 20px rgba(0,0,0,.3);border-radius:3px;padding:8px 11px;font:11px Arial}.objective{position:absolute;top:55px;left:50%;transform:translateX(-50%);white-space:nowrap}.status{position:absolute;left:12px;bottom:76px;font:10px Arial;color:#c0c4c1}.controls{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;pointer-events:auto}.controls button{background:rgba(35,37,37,.9);color:#e7e9e8;border:1px solid #626866;border-radius:3px;padding:9px 12px;font:10px Arial;touch-action:manipulation}.controls button:active{background:#4d514f}.look{position:fixed;top:0;bottom:92px;width:30%;z-index:6;touch-action:none}.look.left{left:0}.look.right{right:0}.boot{position:fixed;inset:0;display:grid;place-items:center;background:#111315;z-index:99;text-align:center;font:13px Arial}.boot small{display:block;color:#aeb3b0;margin-top:10px;font-size:10px}.bar{width:min(340px,70vw);height:4px;background:#303331;margin-top:15px}.bar i{display:block;height:100%;width:0;background:#d1d4d1}@media(max-width:700px){.panel{font-size:9px;padding:7px 8px}.controls button{font-size:8px;padding:8px 9px}.objective{top:52px;font-size:8px}.status{bottom:63px;font-size:8px}}
</style>
</head>
<body>
<div id="game"></div><div class="boot" id="boot"><div>BLACKSITE-01<small id="bootText">Preparing security office...</small><div class="bar"><i id="bar"></i></div></div></div>
<div class="hud"><div class="top"><div class="panel">BLACKSITE-01 // <span id="zone">SECURITY OFFICE</span></div><div class="panel"><span id="clock">11:00 PM</span> &nbsp; POWER <span id="power">100%</span></div></div><div class="objective panel">SECURITY SHIFT // REMAIN ON DUTY UNTIL 06:00</div><div class="status" id="status">SECURITY OFFICE // SYSTEMS AVAILABLE</div><div class="controls"><button id="leftDoor">LEFT DOOR</button><button id="rightDoor">RIGHT DOOR</button><button id="leftLight">LEFT LIGHT</button><button id="rightLight">RIGHT LIGHT</button><button id="camera">CAMERA</button><button id="flashlight">DESK LAMP</button></div></div>
<div class="look left" id="lookLeft"></div><div class="look right" id="lookRight"></div>
<script>
const sources=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js'];let started=false;
function loadThree(i=0){if(i>=sources.length){document.getElementById('bootText').textContent='3D engine unavailable.';return}const s=document.createElement('script');s.src=sources[i];s.onload=start;s.onerror=()=>loadThree(i+1);document.head.appendChild(s)}
function start(){if(started)return;started=true;const T=THREE,game=document.getElementById('game'),scene=new T.Scene();scene.background=new T.Color(0x737773);scene.fog=new T.Fog(0x737773,28,120);
const camera=new T.PerspectiveCamera(67,innerWidth/innerHeight,.05,180);camera.position.set(0,1.65,4.9);camera.rotation.order='YXZ';
const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight,false);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;game.appendChild(renderer.domElement);
function mat(c,r=.7,m=0){return new T.MeshStandardMaterial({color:c,roughness:r,metalness:m})}const M={floor:mat(0x50524f,.86),wall:mat(0xb3b4ae,.9),ceiling:mat(0x999b95,.82),trim:mat(0x303331,.62,.25),steel:mat(0x6d716d,.32,.7),dark:mat(0x202322,.48,.45),desk:mat(0x30312f,.48,.3),rubber:mat(0x171918,.92),paper:mat(0xd1cec3,.92),corridor:mat(0x666864,.9),room:mat(0x777a75,.92),glass:new T.MeshPhysicalMaterial({color:0xb9cbc8,roughness:.18,transmission:.15,transparent:true,opacity:.4}),screen:new T.MeshStandardMaterial({color:0x17201f,roughness:.32,emissive:0x07100f,emissiveIntensity:.45}),white:new T.MeshStandardMaterial({color:0xe3e2d9,roughness:.48,emissive:0x999b94,emissiveIntensity:.18})};
function box(g,w,h,d,x,y,z,m,cast=true){const q=new T.Mesh(new T.BoxGeometry(w,h,d),m);q.position.set(x,y,z);q.castShadow=cast;q.receiveShadow=true;g.add(q);return q}function cyl(g,r,h,x,y,z,m,s=20){const q=new T.Mesh(new T.CylinderGeometry(r,r,h,s),m);q.position.set(x,y,z);q.castShadow=true;q.receiveShadow=true;g.add(q);return q}
/* SECURITY OFFICE: sealed room. Only the two rear doors connect to the facility. */
const office=new T.Group();office.name='SECURITY_OFFICE';scene.add(office);
box(office,16,.16,13,0,.08,0,M.floor,false);box(office,16,5.3,.2,0,2.65,6.5,M.wall);box(office,.2,5.3,13,-8,2.65,0,M.wall);box(office,.2,5.3,13,8,2.65,0,M.wall);box(office,16,.18,13,0,5.28,0,M.ceiling,false);
/* rear wall is built in three sections, leaving exact door openings */
box(office,5.6,5.3,.2,-5.2,2.65,-6.5,M.wall);box(office,5.6,5.3,.2,5.2,2.65,-6.5,M.wall);box(office,4.0,1.1,.2,0,4.75,-6.5,M.wall);
for(const x of[-7.85,7.85])box(office,.12,.25,12.7,x,.45,0,M.trim,false);for(const z of[-6.35,6.35]){box(office,15.7,.25,.12,0,.45,z,M.trim);box(office,15.7,.12,.1,0,4.9,z,M.trim)}
function door(x){const g=new T.Group();g.position.set(x,0,-6.38);office.add(g);box(g,3.2,5.05,.28,0,2.52,0,M.dark);box(g,2.82,4.68,.1,0,2.42,.16,M.steel);box(g,2.55,.08,.08,0,4.78,.22,M.trim);box(g,.1,4.55,.08,-1.27,2.4,.22,M.trim);box(g,.1,4.55,.08,1.27,2.4,.22,M.trim);box(g,.08,.5,.08,.65,2.5,.28,M.dark);return g}const doorL=door(-4.7),doorR=door(4.7);
for(const x of[-1.8,1.8]){box(office,1.45,2.25,.08,x,3.0,-6.38,M.glass,false);box(office,1.6,.08,.12,x,4.15,-6.35,M.trim);box(office,1.6,.08,.12,x,1.85,-6.35,M.trim);box(office,.08,2.25,.12,x-.76,3,-6.35,M.trim);box(office,.08,2.25,.12,x+.76,3,-6.35,M.trim)}
for(let x=-6;x<=6;x+=3)for(let z=-4;z<=4;z+=3)box(office,2.82,.045,2.82,x,5.22,z,M.ceiling,false);for(const x of[-4.5,0,4.5]){box(office,2.2,.07,.7,x,5.08,.4,M.steel,false);box(office,1.85,.035,.48,x,5.025,.4,M.white,false)}
/* desk and four-monitor station */box(office,8.4,.82,2.05,0,.95,2.35,M.desk);box(office,8.15,.08,1.9,0,1.4,2.35,M.dark);for(const x of[-3.25,-1.65,0,1.65,3.25]){box(office,.12,.85,.12,x,.5,2.35,M.steel);box(office,.48,.08,.65,x,.08,2.35,M.steel)}for(const x of[-2.75,-.92,.92,2.75]){box(office,1.55,1.0,.1,x,2.12,1.65,M.dark);box(office,1.4,.83,.035,x,2.12,1.59,M.screen,false);box(office,.09,.48,.08,x,1.58,1.72,M.steel);box(office,.55,.06,.34,x,1.35,1.82,M.rubber,false)}
cyl(office,.72,.16,0,.72,4.15,M.dark);cyl(office,.08,.72,0,.42,4.15,M.steel);box(office,1.2,1.65,.25,0,1.55,4.25,M.dark);box(office,1.35,.18,.72,0,2.38,4.22,M.dark);function cabinet(x,z){box(office,1.25,2.55,.7,x,1.28,z,M.steel);for(let y=.62;y<2.3;y+=.52){box(office,1.0,.05,.06,x,y,z-.37,M.trim);box(office,.06,.08,.2,x+.35,y+.08,z-.4,M.dark)}}cabinet(-6.65,3.8);cabinet(6.65,3.8);box(office,2,4.25,.72,6.55,2.15,-4.65,M.dark);for(let y=.55;y<4;y+=.65)box(office,1.65,.06,.5,6.55,y,-4.25,M.steel);
/* FACILITY MAP. It is outside the office and aligned to the two rear doors. */
const facility=new T.Group();facility.name='BLACKSITE-01_FACILITY_MAP';scene.add(facility);
function floorRect(x,z,w,d){box(facility,w,.18,d,x,.09,z,M.floor,false);for(let xx=x-w/2+1;xx<x+w/2;xx+=2)box(facility,.025,.02,d,xx,.2,z,M.trim,false)}
function room(x,z,w,d){floorRect(x,z,w,d);box(facility,w,4.8,.22,x,2.4,z-d/2,M.room);box(facility,w,4.8,.22,x,2.4,z+d/2,M.room);box(facility,.22,4.8,d,x-w/2,2.4,z,M.room);box(facility,.22,4.8,d,x+w/2,2.4,z,M.room)}
function corridor(x,z,w,d){floorRect(x,z,w,d);box(facility,w,4.8,.22,x,2.4,z-d/2,M.corridor);box(facility,w,4.8,.22,x,2.4,z+d/2,M.corridor)}
/* Two separate exits from security office feed the main south corridor. */
corridor(-4.7,-11.5,3.8,10);corridor(4.7,-11.5,3.8,10);corridor(0,-16.5,13.2,3.8);corridor(10,-20,5,10);corridor(20,-10,5,20);corridor(20,0,5,5);corridor(20,10,5,20);corridor(10,20,20,5);corridor(0,20,5,5);corridor(-10,20,20,5);corridor(-20,10,5,20);corridor(-20,0,5,5);corridor(-20,-10,5,20);corridor(-10,-20,20,5);
/* Main rooms, kept clear of the security office footprint. */
room(20,0,14,18);room(20,20,14,18);room(0,22,18,14);room(-20,22,18,14);room(-20,0,16,16);room(-20,-20,16,16);room(0,-20,18,16);room(20,-20,14,14);
/* Door openings at corridor/room joins: short dark frames instead of overlapping walls. */
function frame(x,z,w,rot=0){const g=new T.Group();g.position.set(x,0,z);g.rotation.y=rot;facility.add(g);box(g,.12,4.7,.18,-w/2,2.35,0,M.trim);box(g,.12,4.7,.18,w/2,2.35,0,M.trim);box(g,w,.12,.18,0,4.7,0,M.trim);return g}
frame(20,-8,3,Math.PI/2);frame(20,8,3,Math.PI/2);frame(20,12,3,Math.PI/2);frame(20,28,3,Math.PI/2);frame(8,20,3);frame(-8,20,3);frame(-20,8,3,Math.PI/2);frame(-20,-8,3,Math.PI/2);frame(-8,-20,3);frame(8,-20,3);frame(20,-20,3);frame(0,-16.5,3);
/* believable ceiling service trays and wall equipment */
for(const x of[-20,0,20]){box(facility,1.2,.12,55,x,4.62,0,M.trim,false);for(let z=-25;z<=25;z+=5)box(facility,.95,.05,.18,x,4.55,z,M.steel,false)}
for(const p of[[20,0],[20,20],[0,22],[-20,22],[-20,0],[-20,-20],[0,-20],[20,-20]]){box(facility,2.2,1.8,.65,p[0],1.05,p[1],M.dark);for(let y=.55;y<2;y+=.4)box(facility,1.8,.04,.5,p[0],y,p[1]-.34,M.steel)}
function sign(x,z,text){const c=document.createElement('canvas');c.width=512;c.height=96;const p=c.getContext('2d');p.fillStyle='#202321';p.fillRect(0,0,512,96);p.strokeStyle='#72766f';p.strokeRect(2,2,508,92);p.fillStyle='#e0e1dc';p.font='bold 24px Arial';p.fillText(text,18,59);const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;const q=new T.Mesh(new T.PlaneGeometry(4.2,.8),new T.MeshStandardMaterial({map:t,roughness:.75}));q.position.set(x,3.7,z);q.rotation.y=Math.PI;facility.add(q)}
sign(20,-7.9,'JUNCTION HALL');sign(20,18.1,'BASEMENT');sign(0,26.2,'RESEARCH');sign(-20,26.2,'CONTAINMENT');sign(-20,7.8,'MAINTENANCE');sign(-20,-7.8,'STORAGE');sign(0,-13.8,'GENERATOR');sign(20,-20,'SERVER ROOM');
/* lighting follows the map instead of illuminating the office through the floor. */
scene.add(new T.HemisphereLight(0xd8ddd8,0x40423f,1.15));const key=new T.RectAreaLight(0xf2f0e7,4.2,7,3);key.position.set(0,5,1);key.rotation.x=Math.PI/2;scene.add(key);for(const x of[-4.5,0,4.5]){const l=new T.PointLight(0xf0eee4,3.1,13,2);l.position.set(x,4.75,.4);l.castShadow=true;l.shadow.mapSize.set(512,512);scene.add(l)}
/* small neutral facility lights */
for(const p of[[20,4.4,0],[20,4.4,20],[0,4.4,22],[-20,4.4,22],[-20,4.4,0],[-20,4.4,-20],[0,4.4,-20],[20,4.4,-20]]){const l=new T.PointLight(0xe2e4df,.65,11,2);l.position.set(...p);scene.add(l)}
let yaw=0,targetYaw=0;function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function look(){camera.rotation.y=yaw;camera.rotation.x=.01}function setLook(d){targetYaw=clamp(targetYaw+d,-.72,.72)}document.getElementById('lookLeft').addEventListener('pointerdown',e=>{e.preventDefault();setLook(-.18)});document.getElementById('lookRight').addEventListener('pointerdown',e=>{e.preventDefault();setLook(.18)});
let leftClosed=true,rightClosed=true,deskOn=true;const status=document.getElementById('status');function st(t){status.textContent=t}document.getElementById('leftDoor').onclick=()=>{leftClosed=!leftClosed;doorL.position.y=leftClosed?0:4.9;st('LEFT DOOR // '+(leftClosed?'SECURED':'OPEN'))};document.getElementById('rightDoor').onclick=()=>{rightClosed=!rightClosed;doorR.position.y=rightClosed?0:4.9;st('RIGHT DOOR // '+(rightClosed?'SECURED':'OPEN'))};document.getElementById('leftLight').onclick=()=>st('LEFT SECURITY LIGHT // ACTIVE');document.getElementById('rightLight').onclick=()=>st('RIGHT SECURITY LIGHT // ACTIVE');document.getElementById('flashlight').onclick=()=>{deskOn=!deskOn;st('DESK LAMP // '+(deskOn?'ON':'OFF'))};document.getElementById('camera').onclick=()=>st('CAMERA SYSTEM // SECURITY OFFICE VIEW');
let minutes=23*60;setInterval(()=>{minutes++;if(minutes>=1440)minutes=0;const h24=Math.floor(minutes/60),m=minutes%60,ap=h24>=12?'PM':'AM',h=h24%12||12;document.getElementById('clock').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+' '+ap},1000);
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false)}addEventListener('resize',resize);function animate(){requestAnimationFrame(animate);yaw+=(targetYaw-yaw)*.08;look();renderer.render(scene,camera)}animate();
let n=0;const timer=setInterval(()=>{n+=20;document.getElementById('bar').style.width=Math.min(n,100)+'%';if(n>=100){clearInterval(timer);setTimeout(()=>document.getElementById('boot').style.display='none',180)}},90)}loadThree();
</script>
</body></html>
