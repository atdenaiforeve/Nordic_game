<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NORDIC // BLACKSITE-01</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050607;color:#dce3e7;font-family:monospace}#game{position:fixed;inset:0}.hud{position:fixed;inset:0;pointer-events:none;z-index:10}.top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px}.panel{background:#080a0ddd;border:1px solid #454d52;box-shadow:0 8px 28px #000b;border-radius:3px;padding:8px 10px;font-size:10px}.objective{position:absolute;top:58px;left:50%;transform:translateX(-50%)}.status{position:absolute;left:10px;bottom:66px;font-size:9px;color:#9aa6ab}.controls{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;pointer-events:auto}.controls button{background:#121719e8;color:#dce4e8;border:1px solid #4b5358;border-radius:3px;padding:9px 11px;font:10px monospace;touch-action:manipulation}.controls button:active{background:#30373b}.look{position:fixed;top:0;bottom:82px;width:30%;z-index:6;touch-action:none}.look.left{left:0}.look.right{right:0}.boot{position:fixed;inset:0;display:grid;place-items:center;background:#050607;z-index:99;text-align:center;font-size:13px}.boot small{display:block;color:#7c878d;margin-top:9px;font-size:9px}.bar{width:min(340px,70vw);height:4px;background:#202629;margin-top:14px}.bar i{display:block;height:100%;width:0;background:#39d9ff}.hidden{display:none}@media(max-width:700px){.panel{font-size:8px;padding:7px 8px}.controls button{font-size:8px;padding:8px}.objective{top:53px;font-size:8px}.status{bottom:58px}}</style></head><body><div id="game"></div><div class="boot" id="boot"><div>BLACKSITE-01 // NIGHT INITIALIZATION<small id="bootText">Loading complete facility...</small><div class="bar"><i id="bar"></i></div></div></div><div class="hud"><div class="top"><div class="panel">BLACKSITE-01 // <span id="zone">SECURITY OFFICE</span></div><div class="panel"><span id="clock">11:00 PM</span> &nbsp; POWER <span id="power">100%</span></div></div><div class="objective panel">OBJECTIVE: Survive until 6:00 AM.</div><div class="status" id="status">FULL MAP: ALL FACILITY AREAS LOADED</div><div class="controls"><button id="leftDoor">LEFT DOOR</button><button id="rightDoor">RIGHT DOOR</button><button id="leftLight">LEFT LIGHT</button><button id="rightLight">RIGHT LIGHT</button><button id="camera">CAMERA</button><button id="flashlight">FLASHLIGHT: ON</button><button id="debug">DEBUG MAP</button></div></div><div class="look left" id="lookLeft"></div><div class="look right" id="lookRight"></div><script>const sources=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js'];let started=false;function fail(t){document.getElementById('bootText').textContent=t}function loadThree(i=0){if(i>=sources.length)return fail('3D engine failed to load.');const s=document.createElement('script');s.src=sources[i];s.onload=start;s.onerror=()=>loadThree(i+1);document.head.appendChild(s)}function start(){if(started)return;started=true;const T=window.THREE;if(!T)return fail('Three.js unavailable.');const game=document.getElementById('game'),boot=document.getElementById('boot'),bar=document.getElementById('bar'),bootText=document.getElementById('bootText');const scene=new T.Scene();scene.background=new T.Color(0x07090a);scene.fog=new T.Fog(0x090c0e,28,115);const camera=new T.PerspectiveCamera(62,innerWidth/innerHeight,.05,180);camera.position.set(0,2.15,8);camera.rotation.order='YXZ';const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));renderer.setSize(innerWidth,innerHeight,false);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;game.appendChild(renderer.domElement);function mat(c,r=.8,m=0){return new T.MeshStandardMaterial({color:c,roughness:r,metalness:m})}const M={concrete:mat(0x55585a,.95),dark:mat(0x15191b,.9),steel:mat(0x656b6e,.3,.75),paint:mat(0x34393c,.8),floor:mat(0x303437,.9),desk:mat(0x363b3d,.65),black:mat(0x080a0b,.85),cyan:new T.MeshStandardMaterial({color:0x09272b,emissive:0x08727c,emissiveIntensity:1.3,roughness:.25}),red:new T.MeshStandardMaterial({color:0x220406,emissive:0xff101a,emissiveIntensity:3,roughness:.3}),green:new T.MeshStandardMaterial({color:0x0b3522,emissive:0x22ff91,emissiveIntensity:1.4,roughness:.3}),yellow:new T.MeshStandardMaterial({color:0x332500,emissive:0xffb300,emissiveIntensity:1.3,roughness:.35})};function box(g,w,h,d,x,y,z,m=M.dark,cast=true){const q=new T.Mesh(new T.BoxGeometry(w,h,d),m);q.position.set(x,y,z);q.castShadow=cast;q.receiveShadow=true;g.add(q);return q}function cyl(g,r,h,x,y,z,m=M.dark,s=16){const q=new T.Mesh(new T.CylinderGeometry(r,r,h,s),m);q.position.set(x,y,z);q.castShadow=true;q.receiveShadow=true;g.add(q);return q}function label(g,x,y,z,text){const c=document.createElement('canvas');c.width=512;c.height=160;const p=c.getContext('2d');p.fillStyle='#061014';p.fillRect(0,0,512,160);p.fillStyle='#43d6df';p.font='bold 23px monospace';p.fillText(text,18,38);p.fillStyle='#8fcfd5';p.font='14px monospace';p.fillText('BLACKSITE-01 // CCTV',18,68);p.fillText('ACCESS: RESTRICTED',18,96);p.fillStyle='#1d464b';for(let i=0;i<4;i++)p.fillRect(18,118+i*8,470,2);const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;const q=new T.Mesh(new T.PlaneGeometry(2.35,.92),new T.MeshStandardMaterial({map:t,emissive:0x07535b,emissiveIntensity:1.1}));q.position.set(x,y,z);g.add(q)}function room(g,w,d,x,z){box(g,w,.18,d,x,.09,z,M.floor,false);box(g,w,6,.28,x,3,z-d/2,M.concrete);box(g,.28,6,d,x-w/2,3,z,M.concrete);box(g,.28,6,d,x+w/2,3,z,M.concrete);box(g,w,.2,d,x,6,z,M.concrete,false)}function doorway(g,x,z,w=3){box(g,w,5.4,.5,x,2.7,z,M.dark);box(g,w-.45,4.8,.12,x,2.5,z+.27,M.steel)}function corridor(g,x,z,w,d){box(g,w,.18,d,x,.09,z,M.floor,false);box(g,w,5.8,.22,x,2.9,z-d/2,M.concrete);box(g,w,5.8,.22,x,2.9,z+d/2,M.concrete)}const facility=new T.Group();facility.name='BLACKSITE-01_FULL_MAP';scene.add(facility);room(facility,16,12,0,0);room(facility,14,18,20,0);room(facility,14,18,20,20);room(facility,18,14,0,22);room(facility,18,14,-20,22);room(facility,16,16,-20,0);room(facility,16,16,-20,-20);room(facility,18,16,0,-20);corridor(facility,10,0,20,5);corridor(facility,20,10,5,20);corridor(facility,10,20,20,5);corridor(facility,-10,20,20,5);corridor(facility,-20,10,5,20);corridor(facility,-20,-10,5,20);corridor(facility,-10,-20,20,5);corridor(facility,10,-20,20,5);doorway(facility,8,0);doorway(facility,20,8);doorway(facility,8,20);doorway(facility,-8,20);doorway(facility,-20,8);doorway(facility,-20,-8);doorway(facility,-8,-20);doorway(facility,8,-20);for(let x=-7;x<=7;x+=2)box(facility,.035,5.8,.07,x,3,-5.82,M.dark,false);for(let x=-6;x<=6;x+=3)box(facility,2.72,.05,11.35,x,5.84,0,M.dark,false);for(let z=-4.5;z<=4.5;z+=2)box(facility,15.8,.02,.025,0,.2,z,M.dark,false);const doorL=box(facility,3.25,5.35,.45,-6.05,2.7,-5.68,M.dark);const doorR=box(facility,3.25,5.35,.45,6.05,2.7,-5.68,M.dark);for(const x of[-6.05,6.05]){box(facility,2.8,4.75,.16,x,2.52,-5.42,M.steel);box(facility,.12,4.55,.2,x-1.4,2.5,-5.3,M.dark);box(facility,.12,4.55,.2,x+1.4,2.5,-5.3,M.dark);box(facility,.28,.44,.06,x+.92,2.55,-5.18,M.green)}box(facility,7.5,1.05,2.25,0,1.22,2.35,M.desk);box(facility,7.55,.15,2.3,0,1.78,2.35,M.black);for(const x of[-1.55,1.55]){box(facility,2.9,1.7,.22,x,2.58,1.48,M.black);label(facility,x,2.58,1.35,x<0?'CAM 01':'CAM 02');box(facility,.1,1,.1,x,2.02,1.48,M.dark)}for(const x of[-2.9,2.9]){box(facility,.9,.5,.7,x,2.03,2.35,M.black);box(facility,.65,.06,.5,x,2.31,2.35,M.steel)}for(const pos of[[20,0,-6],[20,0,6],[20,20,-7],[20,20,7],[0,22,-5],[-20,22,5],[-20,0,-6],[-20,-20,6],[0,-20,-6]]){box(facility,2.8,2.2,.3,pos[0],1.2,pos[2]+pos[1]*0,M.black);box(facility,2.2,1.5,.08,pos[0],2.3,pos[2],M.steel)}for(const x of[-4.8,4.8]){box(facility,1.2,1.6,.2,x,3.05,-5.45,M.dark);for(let y=2.5;y<3.8;y+=.3)box(facility,.9,.035,.03,x,y,-5.32,M.steel,false)}for(let x=-7;x<=7;x+=3)box(facility,2.2,.06,.7,x,5.55,0,M.dark,false);for(let z=-3;z<=3;z+=3){cyl(facility,.34,.07,-5.8,5.55,z,M.black);cyl(facility,.18,.08,-5.8,5.59,z,M.green)}for(let x=-25;x<=25;x+=5)box(facility,.18,.05,.18,x,5.55,20,M.red,false);for(let z=-15;z<=15;z+=5)box(facility,.18,.05,.18,20,5.55,z,M.cyan,false);for(let x=-28;x<=28;x+=4){box(facility,.04,.04,15,x,5.78,0,M.dark,false)}for(const p of[[20,0,0],[20,20,0],[0,22,0],[-20,22,0],[-20,0,0],[-20,-20,0],[0,-20,0]]){box(facility,3.8,3.8,.4,p[0],2.1,p[1]-7,M.dark);for(let y=.8;y<4;y+=.55)box(facility,3.4,.06,.12,p[0],y,p[1]-6.75,M.steel,false)}const signs=[[-0.1,0,-5.9,'SECURITY OFFICE'],[20,0,-8.9,'JUNCTION HALL'],[20,20,-8.9,'BASEMENT'],[0,22,-8.9,'RESEARCH'],[-20,22,-8.9,'CONTAINMENT'],[-20,0,-8.9,'MAINTENANCE'],[-20,-20,-8.9,'STORAGE'],[0,-20,-8.9,'GENERATOR'],[20,-20,-8.9,'SERVER ROOM']];for(const s of signs){const c=document.createElement('canvas');c.width=512;c.height=96;const p=c.getContext('2d');p.fillStyle='#111719';p.fillRect(0,0,512,96);p.strokeStyle='#59666b';p.strokeRect(2,2,508,92);p.fillStyle='#dbe7e9';p.font='bold 24px monospace';p.fillText(s[3],18,58);const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;const q=new T.Mesh(new T.PlaneGeometry(4.2,.8),new T.MeshStandardMaterial({map:t,roughness:.7}));q.position.set(s[0],3.8,s[1]);q.rotation.y=Math.PI;q.castShadow=false;facility.add(q)}const lights=[];for(const p of[[0,5.4,0],[20,5.4,0],[20,5.4,20],[0,5.4,22],[-20,5.4,22],[-20,5.4,0],[-20,5.4,-20],[0,5.4,-20],[20,5.4,-20]]){const l=new T.PointLight(0xe5e9e8,.45,18);l.position.set(...p);scene.add(l);lights.push(l)}const hemi=new T.HemisphereLight(0xc4c7c9,0x080a0b,.35);scene.add(hemi);const redGlow=new T.PointLight(0xff1018,.7,30);redGlow.position.set(0,5,-4);scene.add(redGlow);const leftLight=new T.SpotLight(0xe7f6ff,0,12,Math.PI/5,.7,1),rightLight=new T.SpotLight(0xe7f6ff,0,12,Math.PI/5,.7,1);leftLight.position.set(-6,3,-3);rightLight.position.set(6,3,-3);scene.add(leftLight,rightLight);const lt=new T.Object3D(),rt=new T.Object3D();lt.position.set(-6,1,-6);rt.position.set(6,1,-6);scene.add(lt,rt);leftLight.target=lt;rightLight.target=rt;let doors={L:false,R:false};function toggleDoor(k){doors[k]=!doors[k];const d=k==='L'?doorL:doorR;d.position.y=doors[k]?6.8:2.7}document.getElementById('leftDoor').onclick=()=>toggleDoor('L');document.getElementById('rightDoor').onclick=()=>toggleDoor('R');document.getElementById('leftLight').onclick=()=>leftLight.intensity=leftLight.intensity?0:2.7;document.getElementById('rightLight').onclick=()=>rightLight.intensity=rightLight.intensity?0:2.7;let flash=true;const fp=new T.SpotLight(0xffffff,8,28,Math.PI/6,.72,1.1),ft=new T.Object3D();scene.add(fp,ft);fp.target=ft;document.getElementById('flashlight').onclick=()=>{flash=!flash;fp.intensity=flash?8:0;document.getElementById('flashlight').textContent='FLASHLIGHT: '+(flash?'ON':'OFF')};let view=0;const poses=[new T.Vector3(0,2.15,8),new T.Vector3(-2.4,2.2,8),new T.Vector3(2.4,2.2,8),new T.Vector3(20,2.2,0),new T.Vector3(0,2.2,22),new T.Vector3(-20,2.2,0)];const poseNames=['SECURITY OFFICE','SECURITY OFFICE','SECURITY OFFICE','JUNCTION HALL','RESEARCH WING','MAINTENANCE'];document.getElementById('camera').onclick=()=>{view=(view+1)%poses.length;camera.position.copy(poses[view]);document.getElementById('zone').textContent=poseNames[view];document.getElementById('status').textContent='FULL MAP: CAMERA VIEW '+(view+1)+' / '+poses.length};let debug=false;document.getElementById('debug').onclick=()=>{debug=!debug;document.getElementById('debug').textContent=debug?'DEBUG MAP: ON':'DEBUG MAP';document.getElementById('status').textContent=debug?'DEBUG: FULL FACILITY / WORLD COORDINATES':'FULL MAP: ALL FACILITY AREAS LOADED'};let power=100,seconds=0,yaw=0,pitch=0,lookSide=0,nightStarted=false,debugX=0,debugZ=8;for(const z of[document.getElementById('lookLeft'),document.getElementById('lookRight')]){z.addEventListener('pointerdown',e=>{e.preventDefault();lookSide=z.id==='lookLeft'?-1:1;z.setPointerCapture?.(e.pointerId)},{passive:false});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>z.addEventListener(ev,()=>lookSide=0))}const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);function update(){const total=23*60+seconds,h=Math.floor(total/60)%24,m=Math.floor(total)%60,hh=h===0?12:h>12?h-12:h;document.getElementById('clock').textContent=hh+':'+String(m).padStart(2,'0')+(h<12?' AM':' PM');document.getElementById('power').textContent=Math.round(power)+'%'}let last=performance.now();function animate(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(nightStarted){seconds+=dt;power=Math.max(0,power-dt*.018)}update();const ty=lookSide===-1?-.82:lookSide===1?.82:0;yaw+=(ty-yaw)*Math.min(1,dt*12);camera.rotation.y=yaw;camera.rotation.x+=(0-camera.rotation.x)*Math.min(1,dt*8);if(debug&&(keys.w||keys.arrowup)){camera.position.z-=dt*7}if(debug&&(keys.s||keys.arrowdown)){camera.position.z+=dt*7}if(debug&&(keys.a||keys.arrowleft)){camera.position.x-=dt*7}if(debug&&(keys.d||keys.arrowright)){camera.position.x+=dt*7}camera.position.x=T.MathUtils.clamp(camera.position.x,-34,34);camera.position.z=T.MathUtils.clamp(camera.position.z,-34,34);const p=camera.position;fp.position.copy(p);const dir=new T.Vector3(0,0,-1).applyQuaternion(camera.quaternion).normalize();ft.position.copy(p).addScaledVector(dir,14);renderer.render(scene,camera);requestAnimationFrame(animate)}let prog=0;const selected=Number(sessionStorage.getItem('nordicNight')||1);bootText.textContent='Loading full Blacksite map // NIGHT '+selected;const bootTimer=setInterval(()=>{prog+=8;bar.style.width=Math.min(prog,100)+'%';if(prog<40)bootText.textContent='Building facility geometry...';else if(prog<75)bootText.textContent='Preparing security systems...';else bootText.textContent='Waiting for night shift...';if(prog>=100){clearInterval(bootTimer);setTimeout(()=>{nightStarted=true;boot.classList.add('hidden')},900)}},110);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false)});requestAnimationFrame(animate)}loadThree();</script></body></html>
