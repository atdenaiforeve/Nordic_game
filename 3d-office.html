<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NORDIC // BLACKSITE-01</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050506;color:#ddd;font-family:monospace}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#050506;color:#ddd;z-index:99;text-align:center;font:13px monospace}.loading small{display:block;margin-top:8px;color:#888;font-size:9px}.hidden{display:none!important}.hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:10}.panel{pointer-events:auto;background:#0b0b0dcc;border:1px solid #39373a;border-radius:4px;box-shadow:0 8px 28px #000b}.top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px}.top .panel{padding:8px 10px;font-size:11px}.objective{position:absolute;top:62px;left:50%;transform:translateX(-50%);padding:7px 10px;font-size:9px}.controls{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 20px)}button{background:#151416dd;color:#ddd;border:1px solid #49454a;border-radius:4px;padding:8px 10px;font:10px monospace;touch-action:manipulation}button:active{background:#29272b}@media(max-width:700px){.top .panel{font-size:9px;padding:7px 8px}.controls{gap:4px}.controls button{padding:7px 8px;font-size:8px}.objective{top:56px;font-size:8px}}
</style>
</head>
<body>
<div id="game"></div><div class="loading" id="loading">STARTING NORDIC SECURITY OFFICE...<small id="loadStatus">Loading local 3D engine...</small></div>
<div class="hud" id="hud"><div class="top"><div class="panel">NORDIC SECURITY OFFICE</div><div class="panel"><span id="clock">11:00 PM</span> &nbsp; POWER <span id="power">100%</span></div></div><div class="objective panel">OBJECTIVE: Survive until 6:00 AM.</div><div class="controls"><button id="leftDoor">LEFT DOOR</button><button id="rightDoor">RIGHT DOOR</button><button id="leftLight">LEFT LIGHT</button><button id="rightLight">RIGHT LIGHT</button><button id="flashlight">FLASHLIGHT</button><button id="camera">CAMERA</button><button id="reboot">REBOOT</button></div></div>
<script>
let started=false;
function fail(t){const l=document.getElementById('loading');l.classList.remove('hidden');document.getElementById('hud').style.display='none';document.getElementById('loadStatus').textContent=t}
function startThree(){if(started)return;started=true;try{if(!window.THREE)throw Error('Three.js unavailable');
const T=window.THREE,game=document.getElementById('game'),loading=document.getElementById('loading');
const scene=new T.Scene();scene.background=new T.Color(0x070709);scene.fog=new T.Fog(0x09080a,9,25);
const camera=new T.PerspectiveCamera(61,innerWidth/innerHeight,.05,60);camera.position.set(0,2.15,7.35);scene.add(camera);
const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));renderer.setSize(innerWidth,innerHeight,false);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;game.appendChild(renderer.domElement);
const M={wall:new T.MeshStandardMaterial({color:0x35343a,roughness:.92}),wall2:new T.MeshStandardMaterial({color:0x202126,roughness:.95}),floor:new T.MeshStandardMaterial({color:0x28272a,roughness:.82,metalness:.05}),floor2:new T.MeshStandardMaterial({color:0x17171a,roughness:.9}),metal:new T.MeshStandardMaterial({color:0x56575b,metalness:.78,roughness:.3}),darkmetal:new T.MeshStandardMaterial({color:0x17181b,metalness:.62,roughness:.44}),desk:new T.MeshStandardMaterial({color:0x3a3030,roughness:.62}),black:new T.MeshStandardMaterial({color:0x0b0c0e,roughness:.76}),glass:new T.MeshStandardMaterial({color:0x1a292d,roughness:.22,metalness:.1,emissive:0x06343a,emissiveIntensity:.55}),paper:new T.MeshStandardMaterial({color:0x817d74,roughness:.94}),rubber:new T.MeshStandardMaterial({color:0x101114,roughness:.82}),red:new T.MeshStandardMaterial({color:0x35070a,emissive:0xd20a15,emissiveIntensity:1.8,roughness:.36}),amber:new T.MeshStandardMaterial({color:0x5a3210,emissive:0x9b4b08,emissiveIntensity:.35,roughness:.45})};
function box(w,h,d,x,y,z,m,cast=true,receive=true){let q=new T.Mesh(new T.BoxGeometry(w,h,d),m);q.position.set(x,y,z);q.castShadow=cast;q.receiveShadow=receive;scene.add(q);return q}
function cyl(r,h,x,y,z,m,s=16){let q=new T.Mesh(new T.CylinderGeometry(r,r,h,s),m);q.position.set(x,y,z);q.castShadow=true;q.receiveShadow=true;scene.add(q);return q}
// Room shell: deeper wall layers instead of a flat box room.
box(16,.2,9,0,.1,0,M.floor,false);for(let x=-7;x<=7;x+=2)for(let z=-3.5;z<=3.5;z+=2)box(1.92,.035,1.92,x,.215,z,((x+z)%4===0)?M.floor2:M.floor,false);
box(16,6,.32,0,3,-4.55,M.wall);box(.32,6,9,-8,3,0,M.wall);box(.32,6,9,8,3,0,M.wall);box(16,.25,9,0,6.02,0,M.wall2,false,false);
// Recessed wall panels and seams.
for(let x=-7;x<=7;x+=2){box(.035,5.65,.08,x,3,-4.34,M.darkmetal,false);box(1.75,.035,.06,x,1.0,-4.33,M.wall2,false);box(1.75,.035,.06,x,4.95,-4.33,M.wall2,false)}
for(let x=-6;x<=6;x+=3)box(2.72,.05,8.45,x,5.87,0,M.wall2,false,false);
for(const side of [-1,1])for(let z=-3;z<=3;z+=2.1){box(.07,4.6,1.65,side*7.78,2.9,z,M.wall2,false);box(.04,4.15,1.4,side*7.73,2.9,z,M.metal,false)}
// Rear doors: recessed frames, hinges and handles.
const doors={L:false,R:false},doorMeshes={};function makeDoor(k,x){box(3.15,5.15,.32,x,2.58,-4.31,M.darkmetal);box(2.72,4.78,.16,x,2.55,-4.12,M.wall2);doorMeshes[k]=box(2.36,4.25,.12,x,2.42,-4.01,M.metal);box(2.65,.12,.16,x,4.75,-3.87,M.darkmetal);box(.12,4.55,.16,x-1.31,2.5,-3.87,M.darkmetal);box(.12,4.55,.16,x+1.31,2.5,-3.87,M.darkmetal);cyl(.035,.34,x-1.02,2.5,-3.78,M.metal,10);box(.08,.55,.08,x+.92,2.55,-3.78,M.metal)}makeDoor('L',-6.05);makeDoor('R',6.05);
// Main desk: layered top, front panel, legs and recessed underside.
box(7.25,1.0,2.15,0,1.25,2.45,M.desk);box(7.35,.16,2.22,0,1.77,2.45,M.darkmetal);box(6.95,.12,1.98,0,1.84,2.45,M.desk);box(6.75,.7,.12,0,1.12,1.38,M.wall2);for(const x of [-3.15,3.15])box(.2,1.15,1.9,x,.7,2.45,M.darkmetal);box(1.15,.65,1.55,0,.72,2.48,M.darkmetal);
// Monitor pair with thick bezels and glass faces.
for(const x of [-1.48,1.48]){box(2.72,1.62,.18,x,2.5,1.65,M.black);box(2.38,1.29,.055,x,2.5,1.54,M.glass,false,false);box(2.52,.08,.07,x,3.23,1.57,M.metal,false);cyl(.06,.9,x,2.0,1.63,M.darkmetal,12)}
box(1.65,.06,.75,0,1.94,2.48,M.rubber);box(1.0,.06,.34,0,1.99,2.42,M.metal);for(const x of [-.62,-.42,-.22,0,.22,.42,.62])box(.035,.02,.22,x,2.01,2.2,M.metal,false,false);
// Chair in foreground, kept dark so the office silhouette reads clearly.
cyl(.38,.65,0,1.2,4.65,M.darkmetal);box(.92,.75,.14,0,1.65,4.65,M.black);box(1.05,.14,.75,0,.88,4.65,M.black);for(const a of [0,.9,1.8,2.7]){const x=Math.cos(a)*.55,z=4.65+Math.sin(a)*.55;box(.55,.05,.08,x,.55,z,M.darkmetal)}
// Practical details: cable tray, vent, paper and small desk objects.
box(5.9,.08,.18,0,4.95,-3.98,M.darkmetal,false);box(1.5,.08,1.0,0,5.72,-3.3,M.darkmetal,false,false);for(let i=0;i<8;i++)box(.055,.05,.65,-.5+i*.14,5.69,-3.3,M.metal,false,false);box(2.1,.08,.42,-4.45,5.78,-.6,M.darkmetal,false);box(2.1,.05,.25,-4.45,5.72,-.6,M.paper,false,false);box(.9,.03,.55,-4.65,1.91,2.15,M.paper,false);cyl(.13,.04,-4.1,1.92,2.82,M.metal,12);cyl(.09,.04,4.1,1.91,2.22,M.amber,12);
// Realistic depth lighting: soft fill plus localized red emergency sources.
scene.add(new T.HemisphereLight(0x70747d,0x09080a,.28));const fill=new T.DirectionalLight(0x9da5b5,.18);fill.position.set(0,6,6);fill.castShadow=true;fill.shadow.mapSize.set(512,512);scene.add(fill);
const redAmbient=new T.AmbientLight(0x240006,.09);scene.add(redAmbient);const redKey=new T.PointLight(0xff1720,.72,16);redKey.position.set(0,5.25,-.2);redKey.castShadow=true;redKey.shadow.mapSize.set(256,256);scene.add(redKey);const redL=new T.PointLight(0xd20a18,.42,9);redL.position.set(-5.6,3.5,-2.5);scene.add(redL);const redR=new T.PointLight(0xd20a18,.42,9);redR.position.set(5.6,3.5,-2.5);scene.add(redR);const redBack=new T.PointLight(0xff1018,.5,8);redBack.position.set(0,2.8,-3.8);scene.add(redBack);
for(const x of [-4.5,0,4.5])box(1.7,.055,.25,x,5.72,-.6,M.red,false,false);
// Door-side practical lights remain tied to the existing controls.
const sideL=new T.SpotLight(0xdcefff,0,8,Math.PI/5,.7,1.4),sideR=new T.SpotLight(0xdcefff,0,8,Math.PI/5,.7,1.4);sideL.position.set(-6,3,-2.5);sideR.position.set(6,3,-2.5);scene.add(sideL,sideR);const tl=new T.Object3D(),tr=new T.Object3D();tl.position.set(-6,1,-4.5);tr.position.set(6,1,-4.5);scene.add(tl,tr);sideL.target=tl;sideR.target=tr;
// Player flashlight: tight cone and falloff create actual depth instead of a flat tint.
let flashlightOn=true;const flashlight=new T.SpotLight(0xeaf7ff,5.2,17,Math.PI/8,.58,1.7);flashlight.position.set(0,0,0);flashlight.castShadow=true;flashlight.shadow.mapSize.set(256,256);camera.add(flashlight);const ft=new T.Object3D();ft.position.set(0,-.05,-10);camera.add(ft);flashlight.target=ft;
let power=100,seconds=0,cam=0;function toggleDoor(k){doors[k]=!doors[k];doorMeshes[k].position.y=doors[k]?6.4:2.42}function toggleLight(k){const l=k==='L'?sideL:sideR;l.intensity=l.intensity?0:2.8}
document.getElementById('leftDoor').onclick=()=>toggleDoor('L');document.getElementById('rightDoor').onclick=()=>toggleDoor('R');document.getElementById('leftLight').onclick=()=>toggleLight('L');document.getElementById('rightLight').onclick=()=>toggleLight('R');document.getElementById('flashlight').onclick=()=>{flashlightOn=!flashlightOn;flashlight.intensity=flashlightOn?5.2:0};document.getElementById('camera').onclick=()=>{cam=(cam+1)%4;camera.position.x=cam===0?0:cam===1?-2.0:cam===2?2.0:0};document.getElementById('reboot').onclick=()=>power=Math.max(0,power-2);
let dragging=false,lastX=0,lastY=0,yaw=0,pitch=0;addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY});addEventListener('pointerup',()=>dragging=false);addEventListener('pointercancel',()=>dragging=false);addEventListener('pointermove',e=>{if(!dragging)return;yaw-=(e.clientX-lastX)*.003;pitch-=(e.clientY-lastY)*.002;pitch=Math.max(-.48,Math.min(.42,pitch));lastX=e.clientX;lastY=e.clientY});addEventListener('wheel',e=>{camera.position.z=Math.max(4.7,Math.min(8,e.deltaY>0?camera.position.z+.12:camera.position.z-.12))},{passive:true});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false)});
function update(){const total=23*60+seconds,h=Math.floor(total/60)%24,m=Math.floor(total%60),display=h===0?12:h>12?h-12:h;document.getElementById('clock').textContent=display+':'+String(m).padStart(2,'0')+(h<12?' AM':' PM');document.getElementById('power').textContent=Math.round(power)+'%'}
let last=performance.now();function animate(now){const dt=Math.min(.1,(now-last)/1000);last=now;seconds+=dt;power=Math.max(0,power-dt*.018);update();camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;renderer.render(scene,camera);requestAnimationFrame(animate)}
update();document.getElementById('hud').style.display='block';loading.classList.add('hidden');requestAnimationFrame(animate);
}catch(e){started=false;fail('3D office failed: '+(e.message||'unknown error'))}}
const sources=['./libs/three.min.js','https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js'];let sourceIndex=0;function loadEngine(){if(sourceIndex>=sources.length){fail('3D engine failed to load. Reload and check connection.');return}const s=document.createElement('script');s.src=sources[sourceIndex++];s.onload=startThree;s.onerror=()=>{s.remove();loadEngine()};document.getElementById('loadStatus').textContent=sourceIndex===1?'Loading local 3D engine...':'Trying backup 3D engine...';document.head.appendChild(s)}loadEngine();
</script></body></html>
