<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NORDIC // 3D SECURITY OFFICE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a0b;font-family:Arial,Helvetica,sans-serif;color:#d8e1e8}#game{position:fixed;inset:0}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;font:12px monospace;text-shadow:0 2px 4px #000}.objective{position:absolute;top:46px;left:50%;transform:translateX(-50%);background:#11171add;border:1px solid #59666b;padding:8px 12px;border-radius:4px;font:11px monospace}.controls{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}.controls button{background:#1b2428dd;border:1px solid #59666b;color:#d5dfe2;padding:9px 12px;border-radius:4px;font:11px monospace}.controls button:active{transform:translateY(1px)}.hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font:9px monospace;color:#9aa5a9}.log{position:absolute;left:12px;bottom:16px;font:10px monospace;color:#a4afb3;text-shadow:0 2px 4px #000}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#080a0bee;font:13px monospace;z-index:5}.loading small{display:block;margin-top:8px;font-size:9px;color:#8f9ba0}.hidden{display:none}.crosshair{position:absolute;left:50%;top:50%;width:4px;height:4px;border:1px solid #cfe8ee55;border-radius:50%;transform:translate(-50%,-50%)}
@media(max-width:600px){.top{font-size:9px}.objective{font-size:9px;max-width:90vw;text-align:center}.controls button{padding:8px 9px;font-size:9px}.hint{font-size:8px}}
</style>
</head>
<body>
<div id="game"></div>
<div class="loading" id="loading">BUILDING NORDIC SECURITY OFFICE...<small id="loadStatus">Starting 3D engine...</small></div>
<div class="hud">
 <div class="top"><span>NORDIC // BLACKSITE-01</span><span id="clock">11:00 PM</span><span>POWER <b id="power">100%</b></span></div>
 <div class="objective">OBJECTIVE: Monitor the halls and survive until 6:00 AM.</div>
 <div class="crosshair"></div>
 <div class="controls"><button id="doorL">DOOR L</button><button id="lightL">LIGHT L</button><button id="camera">CAMERA</button><button id="doorR">DOOR R</button><button id="lightR">LIGHT R</button></div>
 <div class="log" id="log">SYSTEM: 3D office initialized.</div>
 <div class="hint">DRAG TO LOOK • SCROLL TO MOVE • TAP CONTROLS ON MOBILE</div>
</div>
<script>
const loading=document.getElementById('loading'),loadStatus=document.getElementById('loadStatus');
function fail(message){loading.innerHTML='NORDIC 3D ENGINE FAILED<small>'+message+'</small>';}
function startThree(){
 if(!window.THREE){fail('Three.js did not load. Check your connection and reload.');return;}
 try{
 const scene=new THREE.Scene();scene.background=new THREE.Color(0x090c0d);scene.fog=new THREE.Fog(0x090c0d,10,28);
 const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.05,60);camera.position.set(0,2.15,7.4);camera.rotation.order='YXZ';
 const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.getElementById('game').appendChild(renderer.domElement);
 const room=new THREE.Group();scene.add(room);
 function mat(c,r=.7,m=0){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});}
 const concrete=mat(0x394348,.92),dark=mat(0x171d20,.8),metal=mat(0x4b565b,.42,.72),black=mat(0x0b0e10,.65,.35),screen=mat(0x07161b,.3,.05);
 function box(n,p,s,ma,cast=true,receive=true){const o=new THREE.Mesh(new THREE.BoxGeometry(...s),ma);o.name=n;o.position.set(...p);o.castShadow=cast;o.receiveShadow=receive;room.add(o);return o}
 box('BackWall',[0,3,-1.8],[16,6,.3],concrete,false,true);box('LeftWall',[-7.85,3,1.2],[.3,6,9],dark,false,true);box('RightWall',[7.85,3,1.2],[.3,6,9],dark,false,true);box('Ceiling',[0,6,1.2],[16,.3,9],dark,false,true);box('Floor',[0,-.15,1.2],[16,.3,9],mat(0x252d30,.98),false,true);
 for(let x=-6;x<=6;x+=3)box('WallSeam',[x,3,-1.61],[.025,5.6,.03],mat(0x667176,.8,.25),false,false);
 for(let y=1;y<=5;y+=2)box('WallJoint',[0,y,-1.62],[15.2,.025,.03],mat(0x1b2326,.8,.15),false,false);
 function makeDoor(side){const x=side==='L'?-6.8:6.8;box('DoorFrame',[x,2.65,0],[1.45,5.25,.45],black);return box('Door '+side,[x,2.65,.28],[1.18,4.95,.16],metal)}
 const dL=makeDoor('L'),dR=makeDoor('R');
 box('DeskBody',[0,1.05,4.9],[9.8,2.1,2.15],dark);box('DeskFrontTrim',[0,1.85,3.79],[9.45,.16,.08],metal,false,false);box('DeskTop',[0,2.08,4.15],[10.1,.24,2.9],metal);
 function monitor(x,label){box(label+'Housing',[x,3.05,3.75],[3.65,2.35,.5],black);box(label+'Screen',[x,3.08,3.45],[3.15,1.85,.08],screen,false,false);box(label+'Stand',[x,2.28,3.95],[.35,1.15,.35],metal);box(label+'Base',[x,1.92,4],[1.45,.14,.7],metal)}
 monitor(-2.25,'CameraMonitor');monitor(2.25,'SystemsMonitor');
 box('Keyboard',[0,2.31,4.9],[2.4,.18,.9],black);for(let x=-.95;x<=.95;x+=.25)box('Key',[x,2.42,4.9],[.18,.05,.55],metal,false,false);for(let x=-3.5;x<=3.5;x+=1.75)box('Cable',[x,2.25,5.8],[.75,.05,.05],black,false,false);
 box('ChairSeat',[0,.95,6.55],[2,.25,2],dark);box('ChairBack',[0,2.15,7.25],[2.1,2.6,.25],dark);box('ChairStem',[0,.35,6.55],[.3,1.1,.3],metal);for(let i=0;i<4;i++){const a=i*Math.PI/2;box('ChairLeg',[Math.cos(a)*.65,.05,6.55+Math.sin(a)*.65],[.9,.12,.12],metal)}
 for(const x of [-4,0,4]){box('CeilingFixture',[x,5.78,1.1],[2.2,.08,.35],metal,false,false);const l=new THREE.PointLight(0xc9d3d4,8,8,2);l.position.set(x,5.4,1.1);l.castShadow=true;l.shadow.mapSize.set(256,256);room.add(l)}
 const glowL=new THREE.PointLight(0x4ad8ef,1.5,4,2);glowL.position.set(-2.25,3.05,3);room.add(glowL);
 const glowR=new THREE.PointLight(0x4ad8ef,1.2,4,2);glowR.position.set(2.25,3.05,3);room.add(glowR);
 let yaw=0,pitch=-.08,drag=false,lastX=0,lastY=0;function applyLook(){camera.rotation.y=yaw;camera.rotation.x=pitch}applyLook();renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;yaw-=dx*.004;pitch=Math.max(-.9,Math.min(.65,pitch-dy*.003));applyLook()});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('wheel',e=>{camera.position.z=Math.max(3.8,Math.min(8.2,camera.position.z+e.deltaY*.004))},{passive:true});
 let power=100,seconds=0,doors={L:true,R:true};function log(t){document.getElementById('log').textContent=t}function updatePower(){power=Math.max(0,power);document.getElementById('power').textContent=Math.round(power)+'%'}function toggleDoor(s){doors[s]=!doors[s];const d=s==='L'?dL:dR;d.scale.x=doors[s]?1:.12;power-=.5;updatePower();log('DOOR '+s+': '+(doors[s]?'CLOSED':'OPEN'))}function lightDoor(s){power-=1.5;updatePower();log('LIGHT '+s+': ACTIVE')}function cameraAction(){log('CAMERA: cycling feed // signal stable');glowL.intensity=3;setTimeout(()=>glowL.intensity=1.5,300)}document.getElementById('doorL').onclick=()=>toggleDoor('L');document.getElementById('doorR').onclick=()=>toggleDoor('R');document.getElementById('lightL').onclick=()=>lightDoor('L');document.getElementById('lightR').onclick=()=>lightDoor('R');document.getElementById('camera').onclick=cameraAction;
 setInterval(()=>{seconds++;if(seconds%5===0){power-=.2;updatePower()}const total=23*60+seconds;const h=Math.floor(total/60)%24,m=total%60,dh=h%12||12;document.getElementById('clock').textContent=(dh<10?'0':'')+dh+':'+(m<10?'0':'')+m+' '+(h>=12?'AM':'PM')},1000);
 function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)}animate();loading.classList.add('hidden');
 window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
 }catch(err){fail('Startup error: '+(err&&err.message?err.message:'unknown error'));}
}
loadStatus.textContent='Loading 3D engine...';
const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js';script.onload=startThree;script.onerror=()=>fail('Could not load the 3D engine. Reload and try again.');document.head.appendChild(script);
setTimeout(()=>{if(!loading.classList.contains('hidden')&&loadStatus)loadStatus.textContent='Still loading the 3D engine...';},2500);
</script>
</body>
</html>
